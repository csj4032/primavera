// ==========================================
// APPENDIX - TestContainers Starter
// ==========================================
// Custom Spring Boot starter for TestContainers integration
// Multi-database support with automatic configuration
// ==========================================

plugins {
    id 'java-library'
    id 'org.springframework.boot' apply false
    id 'io.spring.dependency-management'
}

bootJar.enabled = false
jar.enabled = true

dependencies {
    // ==========================================
    // Spring Boot Dependencies
    // ==========================================
    api 'org.springframework.boot:spring-boot-starter-test'
    api 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-autoconfigure'
    implementation 'org.springframework.boot:spring-boot-configuration-processor'
    
    // ==========================================
    // Spring Data Dependencies
    // ==========================================
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // ==========================================
    // TestContainers Core
    // ==========================================
    api "org.testcontainers:testcontainers:${testContainersVersion}"
    api "org.testcontainers:junit-jupiter:${testContainersVersion}"

    // ==========================================
    // Database TestContainers
    // ==========================================
    api "org.testcontainers:mariadb:${testContainersVersion}"
    api "org.testcontainers:mysql:${testContainersVersion}"
    api "org.testcontainers:postgresql:${testContainersVersion}"
    api "org.testcontainers:mongodb:${testContainersVersion}"

    // ==========================================
    // Message & Search TestContainers
    // ==========================================
    api "org.testcontainers:kafka:${testContainersVersion}"
    api "org.testcontainers:elasticsearch:${testContainersVersion}"

    // ==========================================
    // Database Drivers
    // ==========================================
    implementation "org.mariadb.jdbc:mariadb-java-client:${mariadbVersion}"
    implementation "com.mysql:mysql-connector-j:${mysqlVersion}"
    implementation "org.postgresql:postgresql"
    implementation "org.mongodb:mongodb-driver-sync:${mongodbDriverVersion}"

    // ==========================================
    // Connection Pool
    // ==========================================
    implementation "com.zaxxer:HikariCP"
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'

    // ==========================================
    // Redis Dependencies
    // ==========================================
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation "redis.clients:jedis"

    // ==========================================
    // Kafka Dependencies
    // ==========================================
    implementation 'org.springframework.kafka:spring-kafka'

    // ==========================================
    // Elasticsearch Dependencies
    // ==========================================
    implementation 'org.springframework.boot:spring-boot-starter-data-elasticsearch'

    // ==========================================
    // Test Database Drivers
    // ==========================================
    testImplementation 'org.mariadb.jdbc:mariadb-java-client'
    testImplementation 'org.postgresql:postgresql'
    testImplementation 'com.mysql:mysql-connector-j'

    // ==========================================
    // Annotation Processors
    // ==========================================
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
}