plugins {
    id 'java-library'
    id 'org.springframework.boot' apply false
    id 'io.spring.dependency-management'
}

bootJar.enabled = false
jar.enabled = true

dependencies {
    // Spring Boot 핵심 - 외부 전달
    api 'org.springframework.boot:spring-boot-starter'
    api 'org.springframework.boot:spring-boot-autoconfigure'
    api 'org.springframework.boot:spring-boot-configuration-processor'
    api 'org.springframework.boot:spring-boot-starter-validation'
    
    // TestContainers 핵심 - 외부 전달
    api "org.testcontainers:testcontainers:${testContainersVersion}"
    api "org.testcontainers:junit-jupiter:${testContainersVersion}"
    api "org.testcontainers:mariadb:${testContainersVersion}"
    api "org.testcontainers:mysql:${testContainersVersion}"
    api "org.testcontainers:postgresql:${testContainersVersion}"
    api "org.testcontainers:mongodb:${testContainersVersion}"
    api "org.testcontainers:kafka:${testContainersVersion}"
    api "org.testcontainers:elasticsearch:${testContainersVersion}"
    api "org.testcontainers:vault:${testContainersVersion}"
    api "org.testcontainers:localstack:${testContainersVersion}"

    
    // 내부에서만 사용 - 외부 전달 안됨
    compileOnly "org.springframework.boot:spring-boot-starter-test"
    compileOnly "org.springframework.boot:spring-boot-starter-jdbc"
    compileOnly "org.springframework.boot:spring-boot-starter-data-jpa"
    compileOnly "org.springframework.boot:spring-boot-starter-data-redis"
    compileOnly "org.springframework.boot:spring-boot-starter-data-mongodb"
    compileOnly "org.springframework.boot:spring-boot-starter-data-elasticsearch"
    compileOnly "org.springframework.kafka:spring-kafka"
    compileOnly "org.mariadb.jdbc:mariadb-java-client:${mariadbVersion}"
    compileOnly "com.mysql:mysql-connector-j:${mysqlVersion}"
    compileOnly "org.postgresql:postgresql"
    compileOnly "org.mongodb:mongodb-driver-sync:${mongodbDriverVersion}"
    compileOnly "com.zaxxer:HikariCP"
    compileOnly "redis.clients:jedis"
    
    // AWS SDK v2 - LocalStackBeanCreator를 위한 선택적 의존성
    compileOnly "software.amazon.awssdk:core:${awsSdkVersion}"
    compileOnly "software.amazon.awssdk:auth:${awsSdkVersion}"
    compileOnly "software.amazon.awssdk:regions:${awsSdkVersion}"
    compileOnly "software.amazon.awssdk:s3:${awsSdkVersion}"
    compileOnly "software.amazon.awssdk:dynamodb:${awsSdkVersion}"
    compileOnly "software.amazon.awssdk:sqs:${awsSdkVersion}"
    compileOnly "software.amazon.awssdk:sns:${awsSdkVersion}"
    compileOnly "software.amazon.awssdk:lambda:${awsSdkVersion}"

    // 테스트에서만 사용
    testImplementation "com.fasterxml.jackson.core:jackson-databind"
    testImplementation "com.fasterxml.jackson.core:jackson-core"
    testImplementation "com.fasterxml.jackson.core:jackson-annotations"
    testImplementation "org.springframework.boot:spring-boot-starter-test"
    testImplementation "org.springframework.boot:spring-boot-starter-data-jpa"
    testImplementation "org.springframework.boot:spring-boot-starter-jdbc"
    testImplementation "org.springframework.boot:spring-boot-starter-data-redis"
    testImplementation "org.springframework.kafka:spring-kafka"
    testImplementation "org.mariadb.jdbc:mariadb-java-client"
    testImplementation "com.mysql:mysql-connector-j"
    testImplementation "org.postgresql:postgresql"
    testImplementation "redis.clients:jedis"
    testImplementation "com.zaxxer:HikariCP"

    // AWS SDK v2 - LocalStackBeanCreator를 위한 선택적 의존성
    testImplementation "software.amazon.awssdk:core:${awsSdkVersion}"
    testImplementation "software.amazon.awssdk:auth:${awsSdkVersion}"
    testImplementation "software.amazon.awssdk:regions:${awsSdkVersion}"
    testImplementation "software.amazon.awssdk:s3:${awsSdkVersion}"
    testImplementation "software.amazon.awssdk:dynamodb:${awsSdkVersion}"
    testImplementation "software.amazon.awssdk:sqs:${awsSdkVersion}"
    testImplementation "software.amazon.awssdk:sns:${awsSdkVersion}"
    testImplementation "software.amazon.awssdk:lambda:${awsSdkVersion}"

    // 어노테이션 처리
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
}