spring:
  main:
    allow-bean-definition-overriding: true

logging:
  level:
    com.genius.primavera.testcontainers: DEBUG
    org.testcontainers: INFO
    org.springframework.test: INFO

# TestContainers configuration - IDE config_text_4 config_text_2 config_text_1 typeconfig_text_1 configuration config_text_2
testcontainers:
  # config_text_2 defaultconfig_text_1 (config_text_2 config_text_5 config_text_2)
  defaults:
    startupTimeout: 60
    imagePullPolicy: IF_NOT_PRESENT
    networkMode: BRIDGE
    environment:
      TZ: "Asia/Seoul"
      
  # 개config_text_1 config_text_4 configuration
  containers:
    
    # MariaDB config_text_4 - config_text_3 configuration config_text_1hour
    userdb:
      type: MARIADB
      mariadb:
        image: "mariadb:11.4.7"
        startupTimeout: 120
        database: "users"
        username: "user_admin"
        password: "user_password"
        rootPassword: "root_password"
        characterSet: "utf8mb4"
        collation: "utf8mb4_unicode_ci"
        binlogEnabled: true
        slowQueryLogEnabled: true
        environment:
          MARIADB_AUTO_UPGRADE: "1"
          MARIADB_DISABLE_UPGRADE_BACKUP: "1"
    
    # MariaDB config_text_4 - minimum configuration config_text_1hour
    logdb:
      type: MARIADB
      mariadb:
        database: "logs"
        username: "logger"
        password: "log_pass"
        
    # MySQL config_text_4 - config_text_3 configuration config_text_1hour
    mysqldb:
      type: MYSQL
      mysql:
        image: "mysql:8.0"
        startupTimeout: 90
        database: "testdb"
        username: "testuser"
        password: "testpass"
        rootPassword: "root_password"
        characterSet: "utf8mb4"
        collation: "utf8mb4_unicode_ci"
        sqlMode: STRICT_TRANS_TABLES
        defaultStorageEngine: INNODB
        maxConnections: 200
        binlogEnabled: true
        slowQueryLogEnabled: true
        defaultTimeZone: "Asia/Seoul"
        environment:
          MYSQL_INNODB_BUFFER_POOL_SIZE: "256M"
          MYSQL_THREAD_CACHE_SIZE: "16"
          
    # PostgreSQL config_text_4 - config_text_3 configuration config_text_1hour
    postgresdb:
      type: POSTGRESQL
      postgresql:
        image: "postgres:16"
        startupTimeout: 80
        database: "appdb"
        username: "appuser"
        password: "apppass"
        locale: "ko_KR.UTF-8"
        encoding: "UTF8"
        sharedBuffers: "256MB"
        workMem: "8MB"
        maintenanceWorkMem: "128MB"
        maxConnections: 150
        logLevel: INFO
        autovacuum: true
        sslMode: PREFER
        timezone: "Asia/Seoul"
        dateStyle: "ISO, YMD"
        extensions: ["pg_stat_statements", "uuid-ossp"]
        environment:
          POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=ko_KR.UTF-8"
        
    # Redis cache - config_text_3 configuration config_text_1hour
    cache:
      type: REDIS
      redis:
        image: "redis:7-alpine"
        password: "cache_password"
        maxMemory: "512mb"
        maxMemoryPolicy: ALLKEYS_LRU
        persistenceEnabled: false
        appendOnlyEnabled: false
        startupTimeout: 45
        environment:
          REDIS_SAVE_POLICY: '""'
          
    # Redis session config_text_3 - minimum configuration
    session:
      type: REDIS
      redis:
        password: "session_pass"
        persistenceEnabled: true
        
    # MongoDB config_text_4 - config_text_3 configuration config_text_1hour
    mongodb:
      type: MONGODB
      mongodb:
        image: "mongo:7"
        database: "appdata"
        username: "mongouser"
        password: "mongopass"
        authDatabase: "admin"
        replicaSetName: "rs0"
        shardingEnabled: false
        wiredTigerCacheSizeMB: 1024
        journalEnabled: true
        oplogSizeMB: 512
        indexBuildInBackground: true
        storageEngine: WIRED_TIGER
        authMechanism: SCRAM_SHA_256
        environment:
          MONGO_INITDB_ROOT_USERNAME: "root"
          MONGO_INITDB_ROOT_PASSWORD: "rootpass"
          
    # Kafka config_text_1hourconfig_text_1
    messaging:
      type: KAFKA
      kafka:
        image: "confluentinc/cp-kafka:7.5.0"
        startupTimeout: 180
        environment:
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
          KAFKA_NUM_PARTITIONS: "3"
          KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
          
    # Elasticsearch config_text_4
    search:
      type: ELASTICSEARCH
      elasticsearch:
        image: "docker.elastic.co/elasticsearch/elasticsearch:8.12.0"
        startupTimeout: 120
        environment:
          discovery.type: "single-node"
          xpack.security.enabled: "false"
          bootstrap.memory_lock: "true"
          ES_JAVA_OPTS: "-Xms512m -Xmx512m"
          
    # Vault hourconfig_text_2 config_text_2
    secrets:
      type: VAULT
      vault:
        image: "hashicorp/vault:1.14.0"
        startupTimeout: 60
        environment:
          VAULT_DEV_ROOT_TOKEN_ID: "test-token"
          VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
          
    # LocalStack AWS config_text_2 config_text_3
    localstack:
      type: LOCALSTACK
      localstack:
        image: "localstack/localstack:3.0"
        startupTimeout: 120
        services: [S3, DYNAMODB, SQS, SNS, LAMBDA]
        debugMode: true
        edgePort: 4566
        useLegacyPorts: false
        lambdaExecutor: DOCKER
        environment:
          LAMBDA_RUNTIME_ENVIRONMENT_TIMEOUT: "30"
          LAMBDA_REMOVE_CONTAINERS: "true"
          
    # 테스트용 설정들
    configPrimaryDb:
      type: MARIADB
      mariadb:
        image: "mariadb:11.4.7"
        database: "primary_db"
        username: "primary_user"
        password: "primary_pass"
        
    configSecondaryDb:
      type: MARIADB
      mariadb:
        database: "secondary_db"
        username: "secondary_user"
        password: "secondary_pass"
        
    configCache:
      type: REDIS
      redis:
        image: "redis:7-alpine"
        password: "redis_password"