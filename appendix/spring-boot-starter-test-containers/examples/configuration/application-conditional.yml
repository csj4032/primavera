# Example configuration for conditional container registration
# This shows how to selectively enable/disable container types

testcontainers:
  # Registry configuration for conditional loading
  registry:
    # Control which container types are enabled
    enabled:
      mariadb: true      # Enable MariaDB containers
      mysql: true        # Enable MySQL containers  
      postgresql: false  # Disable PostgreSQL containers
      redis: true        # Enable Redis containers
      kafka: false       # Disable Kafka containers
      mongodb: false     # Disable MongoDB containers
      elasticsearch: false # Disable Elasticsearch containers
    
    # Auto-discovery of external plugins via SPI
    autoDiscovery: true
    
    # Lazy initialization - registries initialized on first use
    lazyInitialization: true
  
  # Regular container configurations (only enabled types will be processed)
  containers:
    # This will work because mariadb is enabled
    primaryDb:
      image: "mariadb:11.4.7"
      database: "test_db"
      username: "test_user"
      password: "test_pass"
    
    # This will work because redis is enabled  
    sessionCache:
      image: "redis:7-alpine"
      password: "redis_pass"
    
    # This would be ignored because postgresql is disabled
    analyticsDb:
      image: "postgres:16"
      database: "analytics"
      username: "analytics_user"
      password: "analytics_pass"

# Example with all types disabled except specific ones
---
spring:
  config:
    activate:
      on-profile: minimal

testcontainers:
  registry:
    enabled:
      mariadb: true
      mysql: false
      postgresql: false
      redis: false
      kafka: false
      mongodb: false
      elasticsearch: false
    autoDiscovery: false  # Don't load external plugins
    lazyInitialization: false  # Initialize immediately
  
  containers:
    onlyDb:
      image: "mariadb:11.4.7"
      database: "minimal_test"

# Example with performance optimizations
---
spring:
  config:
    activate:
      on-profile: performance

testcontainers:
  registry:
    # Enable only lightweight containers
    enabled:
      mariadb: false
      mysql: false
      postgresql: false
      redis: true       # Fast startup
      kafka: false
      mongodb: true     # Reasonable startup time
      elasticsearch: false
    autoDiscovery: true
    lazyInitialization: true
  
  containers:
    fastCache:
      image: "redis:7-alpine"
    
    quickDb:
      image: "mongo:7"