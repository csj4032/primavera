primavera:
  testcontainers:
    lifecycleMode: PER_TEST
    containers:
      mariadb:
        enabled: true
        dockerImageName: mariadb:11.4.7
        databaseName: primavera
        username: primavera
        password: primavera
      redis:
        enabled: true
        dockerImageName: redis:7-alpine
      mysql:
        enabled: false
        dockerImageName: mysql:8.0
        databaseName: primavera
        username: primavera
        password: primavera
      postgresql:
        enabled: false
        dockerImageName: postgres:15
        databaseName: primavera
        username: primavera
        password: primavera

logging:
  level:
    com.genius.primavera: DEBUG
    org.testcontainers: INFO