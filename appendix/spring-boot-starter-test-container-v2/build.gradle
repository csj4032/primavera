plugins {
    id 'java-library'
    id 'org.springframework.boot' apply false
    id 'io.spring.dependency-management'
}

dependencyManagement {
    imports {
        mavenBom org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES
    }
}

dependencies {
    // Spring Boot
    api 'org.springframework.boot:spring-boot-starter'
    api 'org.springframework.boot:spring-boot-starter-test'
    api 'org.springframework.boot:spring-boot-starter-jdbc'
    
    // TestContainers
    api "org.testcontainers:testcontainers:${testContainersVersion}"
    api "org.testcontainers:junit-jupiter:${testContainersVersion}"
    api "org.testcontainers:mariadb:${testContainersVersion}"
    api "org.testcontainers:mysql:${testContainersVersion}"
    api "org.testcontainers:postgresql:${testContainersVersion}"
    api "org.testcontainers:kafka:${testContainersVersion}"
    api "org.testcontainers:elasticsearch:${testContainersVersion}"
    api "org.testcontainers:mongodb:${testContainersVersion}"    
    
    // Redis for testing
    testImplementation 'org.springframework.boot:spring-boot-starter-data-redis'
    
    // Database Drivers
    api "org.mariadb.jdbc:mariadb-java-client:${mariadbVersion}"
    api "com.mysql:mysql-connector-j:${mysqlVersion}"
    api "org.postgresql:postgresql"
    
    // MongoDB Driver
    testImplementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
    
    // Lombok
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    
    // Configuration Processor
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

test {
    useJUnitPlatform()
    
    // 병렬 실행 설정
    systemProperty 'junit.jupiter.execution.parallel.enabled', 'true'
    systemProperty 'junit.jupiter.execution.parallel.mode.default', 'concurrent'
    systemProperty 'junit.jupiter.execution.parallel.mode.classes.default', 'concurrent'
    systemProperty 'junit.jupiter.execution.parallel.config.strategy', 'dynamic'
    systemProperty 'junit.jupiter.execution.parallel.config.fixed.parallelism', '4'
    
    // 메모리 설정 (병렬 실행 시 더 많은 메모리 필요)
    minHeapSize = "512m"
    maxHeapSize = "2g"
    
    // 포크 설정 (병렬 실행을 위해 새 JVM 프로세스 사용)
    forkEvery = 0  // 모든 테스트를 같은 JVM에서 실행
    
    // TestContainers 관련 설정
    systemProperty 'testcontainers.reuse.enable', 'false'
    
    // 로깅 설정
    testLogging {
        events "passed", "skipped", "failed", "standard_out", "standard_error"
        exceptionFormat "full"
        showCauses true
        showExceptions true
        showStackTraces true
    }
}