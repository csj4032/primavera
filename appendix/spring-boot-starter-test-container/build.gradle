plugins {
    id 'java-library'
    id 'org.springframework.boot' version "${springBootVersion}"
    id 'io.spring.dependency-management' version "${springDependencyManagementVersion}"
}

group = 'com.genius.primavera'
version = '1.0.0'

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

dependencies {
    implementation "org.springframework.boot:spring-boot-autoconfigure"
    implementation 'org.springframework.boot:spring-boot-starter-test'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation "org.mariadb.jdbc:mariadb-java-client:${mariadbVersion}"
    implementation "org.testcontainers:testcontainers:${testContainersVersion}"
    implementation "org.testcontainers:junit-jupiter:${testContainersVersion}"
    implementation "org.testcontainers:mariadb:${testContainersVersion}"
    implementation "org.testcontainers:postgresql:${testContainersVersion}"
    implementation "org.testcontainers:kafka:${testContainersVersion}"
    implementation "org.testcontainers:elasticsearch:${testContainersVersion}"
    implementation "org.testcontainers:mongodb:${testContainersVersion}"
    implementation "org.testcontainers:vault:${testContainersVersion}"
    implementation "com.redis.testcontainers:testcontainers-redis:1.6.4"
    testImplementation "org.mariadb.jdbc:mariadb-java-client:${mariadbVersion}"
    testImplementation project(":appendix:spring-boot-starter-test-container")
}

bootJar {
    enabled = false
}

jar {
    enabled = true
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

test {
    useJUnitPlatform()
}