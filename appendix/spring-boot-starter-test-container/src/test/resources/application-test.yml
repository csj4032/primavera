# TestContainer 스타터 테스트용 설정
primavera:
  testcontainers:
    mariadb:
      image: mariadb:11.4.7
      databaseName: test_primavera
      username: test_user
      password: test_password

# Spring Boot 설정
spring:
  datasource:
    # TestContainer가 동적으로 설정하므로 별도 설정 불필요
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      connection-timeout: 20000

# 로깅 설정
logging:
  level:
    com.genius.primavera.testContainer: DEBUG
    org.testcontainers: INFO
    org.springframework.test: INFO