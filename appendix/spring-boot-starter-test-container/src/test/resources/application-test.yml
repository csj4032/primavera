primavera:
  testcontainers:
    lifecycleMode: PER_CLASS
    mariadb:
      dockerImageName: mariadb:11.4.7
      driverClassName: org.mariadb.jdbc.Driver
      databaseName: primavera_test
      username: test_user
      password: test_password
      initScript: sql/init.sql
    mysql:
      dockerImageName: mysql:8.0
      driverClassName: com.mysql.cj.jdbc.Driver
      databaseName: mysql_test
      username: mysql_user
      password: mysql_password
    postgresql:
      dockerImageName: postgres:15
      driverClassName: org.postgresql.Driver
      databaseName: postgres_test
      username: postgres_user
      password: postgres_password
    redis:
      dockerImageName: redis:7.0
      port: 6379
    kafka:
      dockerImageName: confluentinc/cp-kafka:latest
      port: 9092
    elasticsearch:
      dockerImageName: docker.elastic.co/elasticsearch/elasticsearch:8.5.0
      clusterName: test-cluster
      httpPort: 9200
      transportPort: 9300

logging:
  level:
    com.genius.primavera.testcontainer: DEBUG
    org.testcontainers: INFO
    root: INFO

spring:
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create-drop