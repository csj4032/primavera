plugins {
    id 'org.springframework.boot' version "${springBootVersion}"
    id 'io.spring.dependency-management' version "${springDependencyManagementVersion}"
}

dependencies {
    implementation "org.springframework.boot:spring-boot-starter-aop"
    implementation "org.springframework.boot:spring-boot-starter-jdbc"
    implementation "org.springframework.boot:spring-boot-starter-web"
    implementation "org.mybatis.spring.boot:mybatis-spring-boot-starter:${mybatisSpringBootStarterVersion}"
    implementation "org.mybatis.dynamic-sql:mybatis-dynamic-sql:${mybatisDynamicSqlVersion}"
    implementation "org.mariadb.jdbc:mariadb-java-client:${mariadbVersion}"
    compileOnly "org.hibernate:hibernate-validator:${hibernateValidatorVersion}"
    compileOnly "com.zaxxer:HikariCP:${hikariCPVersion}"
    testImplementation "org.springframework.boot:spring-boot-starter-test"
    testImplementation "org.springframework.security:spring-security-crypto:${springSecurityVersion}"
    testImplementation "org.mybatis.spring.boot:mybatis-spring-boot-starter-test:${mybatisSpringBootStarterVersion}"
    testImplementation "org.springframework.security:spring-security-test"
    testImplementation "org.mockito:mockito-core:4.+"
    testImplementation project(':appendix:spring-boot-starter-test-container')
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    testCompileOnly "org.projectlombok:lombok:${lombokVersion}"
    testAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    implementation "org.testcontainers:testcontainers:${testContainersVersion}"
    implementation "org.testcontainers:junit-jupiter:${testContainersVersion}"
    implementation "org.testcontainers:mariadb:${testContainersVersion}"
}