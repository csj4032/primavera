spring:
  config:
    activate:
      on-profile: hikari-balanced
  cloud:
    config:
      enabled: false
    vault:
      enabled: false
  datasource:
    hikari:
      minimum-idle: 5                    # minimum config_text_2 connection: 5config_text_1 (config_text_3 config_text_2)
      maximum-pool-size: 10              # maximum connection: 10config_text_1 (dayconfig_text_2 config_text_1hourconfig_text_1)
      idle-timeout: 600000               # config_text_2 config_text_4: 10minute (config_text_3)
      max-lifetime: 1800000              # connection config_text_2: 30minute (config_text_2)
      connection-timeout: 30000          # connection config_text_4: 30second (config_text_4 waiting)
      pool-name: "BalancedHikariPool"
      leak-detection-threshold: 60000    # config_text_2 config_text_2: 1minute (developmentenvironment config_text_2)
      connection-test-query: "SELECT 1"
      validation-timeout: 5000           # config_text_2 config_text_4: 5second

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 1000
    default-statement-timeout: 30
    cache-enabled: false
    local-cache-scope: statement
  type-aliases-package: com.genius.primavera.domain
  type-handlers-package: com.genius.primavera.domain