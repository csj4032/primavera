spring:
  config:
    activate:
      on-profile: hikari-performance-focused
  cloud:
    config:
      enabled: false
    vault:
      enabled: false
  datasource:
    hikari:
      minimum-idle: 10                   # minimum config_text_2 connection: 10config_text_1 (config_text_1hour config_text_2 config_text_2)
      maximum-pool-size: 20              # maximum connection: 20config_text_1 (config_text_2 config_text_1hourconfig_text_1)
      idle-timeout: 300000               # config_text_2 config_text_4: 5minute (connection config_text_2)
      max-lifetime: 1800000              # connection config_text_2: 30minute (안정config_text_1 config_text_2)
      connection-timeout: 20000          # connection config_text_4: 20second (config_text_3 waiting)
      pool-name: "PerformanceHikariPool"
      leak-detection-threshold: 0        # config_text_2 config_text_2: config_text_1enabled (config_text_1능 config_text_3)
      connection-test-query: "SELECT 1"
      validation-timeout: 3000           # config_text_2 config_text_4: 3second (config_text_2 config_text_2)
      initialization-fail-timeout: 1     # secondconfig_text_2 failedhour config_text_1hour failed

primavera:
  testcontainers:
    mariadb:
      dockerImageName: mariadb:11.4.7
      driverClassName: org.mariadb.jdbc.Driver
      databaseName: primavera
      username: primavera
      password: primavera
      initScript: sql/init.sql

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 1000
    default-statement-timeout: 30
    cache-enabled: false
    local-cache-scope: statement
  type-aliases-package: com.genius.primavera.domain
  type-handlers-package: com.genius.primavera.domain