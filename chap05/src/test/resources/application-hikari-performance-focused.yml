spring:
  config:
    activate:
      on-profile: hikari-performance-focused
  cloud:
    config:
      enabled: false
    vault:
      enabled: false
  datasource:
    hikari:
      minimum-idle: 10                   # 최소 유휴 연결: 10개 (즉시 사용 가능)
      maximum-pool-size: 20              # 최대 연결: 20개 (높은 동시성)
      idle-timeout: 300000               # 유휴 타임아웃: 5분 (연결 유지)
      max-lifetime: 1800000              # 연결 수명: 30분 (안정성 확보)
      connection-timeout: 20000          # 연결 타임아웃: 20초 (적절한 대기)
      pool-name: "PerformanceHikariPool"
      leak-detection-threshold: 0        # 누수 감지: 비활성화 (성능 최우선)
      connection-test-query: "SELECT 1"
      validation-timeout: 3000           # 검증 타임아웃: 3초 (빠른 검증)
      initialization-fail-timeout: 1     # 초기화 실패시 즉시 실패

primavera:
  testcontainers:
    mariadb:
      enabled: true
      dockerImageName: mariadb:11.4.7
      driverClassName: org.mariadb.jdbc.Driver
      databaseName: primavera
      username: primavera
      password: primavera
      initScript: sql/init-db.sql

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 1000
    default-statement-timeout: 30
    cache-enabled: false
    local-cache-scope: statement
  type-aliases-package: com.genius.primavera.domain
  type-handlers-package: com.genius.primavera.domain