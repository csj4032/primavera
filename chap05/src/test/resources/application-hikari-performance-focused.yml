# 성능 중심 연결 풀 설정 - 고성능 요구사항용
spring:
  application:
    name: HikariPerformanceTest
  cloud:
    config:
      enabled: false
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://localhost:1109/primavera?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
    username: primavera
    password: primavera
    hikari:
      # === 성능 최우선 설정 ===
      minimum-idle: 10                   # 최소 유휴 연결: 10개 (즉시 사용 가능)
      maximum-pool-size: 20              # 최대 연결: 20개 (높은 동시성)
      idle-timeout: 300000               # 유휴 타임아웃: 5분 (연결 유지)
      max-lifetime: 1800000              # 연결 수명: 30분 (안정성 확보)
      connection-timeout: 20000          # 연결 타임아웃: 20초 (적절한 대기)
      pool-name: "PerformanceHikariPool"
      leak-detection-threshold: 0        # 누수 감지: 비활성화 (성능 최우선)
      
      # 성능 최적화 설정
      connection-test-query: "SELECT 1"
      validation-timeout: 3000           # 검증 타임아웃: 3초 (빠른 검증)
      initialization-fail-timeout: 1     # 초기화 실패시 즉시 실패
      
      # 기대 효과: 최고 처리량, 낮은 지연시간, 높은 메모리 사용, 최대 동시성

logging:
  level:
    com.zaxxer.hikari: INFO              # 성능을 위해 로그 레벨 조정
    com.genius.primavera.hikari: DEBUG