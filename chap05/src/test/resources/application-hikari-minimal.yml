spring:
  config:
    activate:
      on-profile: hikari-minimal
  cloud:
    config:
      enabled: false
    vault:
      enabled: false
  datasource:
    hikari:
      minimum-idle: 1                    # minimum config_text_2 connection: 1config_text_1 (memory config_text_2)
      maximum-pool-size: 3               # maximum connection: 3config_text_1 (config_text_3)
      idle-timeout: 30000                # config_text_2 config_text_4: 30second (config_text_2 config_text_2)
      max-lifetime: 300000               # connection config_text_2: 5minute (config_text_2 config_text_2)
      connection-timeout: 5000           # connection config_text_4: 5second (config_text_2 failed)
      pool-name: "MinimalHikariPool"
      leak-detection-threshold: 0        # config_text_2 config_text_2: config_text_1enabled (config_text_2 config_text_2)

primavera:
  testcontainers:
    mariadb:
      dockerImageName: mariadb:11.4.7
      driverClassName: org.mariadb.jdbc.Driver
      databaseName: primavera
      username: primavera
      password: primavera
      initScript: sql/init.sql

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 1000
    default-statement-timeout: 30
    cache-enabled: false
    local-cache-scope: statement
  type-aliases-package: com.genius.primavera.domain
  type-handlers-package: com.genius.primavera.domain