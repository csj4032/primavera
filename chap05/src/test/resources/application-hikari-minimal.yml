spring:
  config:
    activate:
      on-profile: hikari-minimal
  cloud:
    config:
      enabled: false
    vault:
      enabled: false
  datasource:
    hikari:
      minimum-idle: 1                    # 최소 유휴 연결: 1개 (메모리 절약)
      maximum-pool-size: 3               # 최대 연결: 3개 (제한적)
      idle-timeout: 30000                # 유휴 타임아웃: 30초 (빠른 해제)
      max-lifetime: 300000               # 연결 수명: 5분 (짧은 수명)
      connection-timeout: 5000           # 연결 타임아웃: 5초 (빠른 실패)
      pool-name: "MinimalHikariPool"
      leak-detection-threshold: 0        # 누수 감지: 비활성화 (성능 우선)

primavera:
  testcontainers:
    mariadb:
      dockerImageName: mariadb:11.4.7
      driverClassName: org.mariadb.jdbc.Driver
      databaseName: primavera
      username: primavera
      password: primavera
      initScript: sql/init.sql

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 1000
    default-statement-timeout: 30
    cache-enabled: false
    local-cache-scope: statement
  type-aliases-package: com.genius.primavera.domain
  type-handlers-package: com.genius.primavera.domain