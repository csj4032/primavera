spring:
  config:
    activate:
      on-profile: hikari-resource-constrained
  cloud:
    config:
      enabled: false
    vault:
      enabled: false
  datasource:
    hikari:
      minimum-idle: 2                    # minimum config_text_2 connection: 2config_text_1 (minimumconfig_text_1 config_text_2)
      maximum-pool-size: 5               # maximum connection: 5config_text_1 (엄격config_text_1 제config_text_1)
      idle-timeout: 60000                # config_text_2 config_text_4: 1minute (config_text_3 config_text_2)
      max-lifetime: 900000               # connection config_text_2: 15minute (config_text_2 config_text_2)
      connection-timeout: 10000          # connection config_text_4: 10second (config_text_2 waiting)
      pool-name: "ResourceConstrainedPool"
      leak-detection-threshold: 30000    # config_text_2 config_text_2: 30second (엄격config_text_1 config_text_2)
      connection-test-query: "SELECT 1"
      validation-timeout: 2000           # config_text_2 config_text_4: 2second (config_text_2 config_text_2)
      initialization-fail-timeout: 1     # secondconfig_text_2 failedhour config_text_1hour failed
      register-mbeans: true              # JMX config_text_4 enabled

primavera:
  testcontainers:
    mariadb:
      dockerImageName: mariadb:11.4.7
      driverClassName: org.mariadb.jdbc.Driver
      databaseName: primavera
      username: primavera
      password: primavera
      initScript: sql/init.sql

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 1000
    default-statement-timeout: 30
    cache-enabled: false
    local-cache-scope: statement
  type-aliases-package: com.genius.primavera.domain
  type-handlers-package: com.genius.primavera.domain