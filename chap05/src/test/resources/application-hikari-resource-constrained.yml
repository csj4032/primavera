# 리소스 제약 환경용 연결 풀 설정 - 메모리/연결 제한 환경
spring:
  config:
    activate:
      on-profile: hikari-resource-constrained
    import:
      - "optional:vault:"
      - "optional:configserver:"
  cloud:
    vault:
      host: localhost
      port: 8200
      scheme: http
      authentication: TOKEN
      token: ${VAULT_TOKEN:primavera-dev-token}
      connection-timeout: 5000
      read-timeout: 15000
      fail-fast: true
      kv:
        enabled: true
        backend: secret
        profile-separator: '/'
        default-context: MyBatisLoggingApplication
        application-name: MyBatisLoggingApplication
        profiles: test
  datasource:
    hikari:
      minimum-idle: 2                    # 최소 유휴 연결: 2개 (최소한 확보)
      maximum-pool-size: 5               # 최대 연결: 5개 (엄격한 제한)
      idle-timeout: 60000                # 유휴 타임아웃: 1분 (적극적 해제)
      max-lifetime: 900000               # 연결 수명: 15분 (중간 수명)
      connection-timeout: 10000          # 연결 타임아웃: 10초 (보통 대기)
      pool-name: "ResourceConstrainedPool"
      leak-detection-threshold: 30000    # 누수 감지: 30초 (엄격한 감지)
      connection-test-query: "SELECT 1"
      validation-timeout: 2000           # 검증 타임아웃: 2초 (빠른 검증)
      initialization-fail-timeout: 1     # 초기화 실패시 즉시 실패
      register-mbeans: true              # JMX 모니터링 활성화

primavera:
  testcontainers:
    mariadb:
      enabled: true
      dockerImageName: mariadb:11.4.7
      driverClassName: org.mariadb.jdbc.Driver
      databaseName: primavera
      username: primavera
      password: primavera
      initScript: sql/init-db.sql

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 1000
    default-statement-timeout: 30
    cache-enabled: false
    local-cache-scope: statement
  type-aliases-package: com.genius.primavera.domain
  type-handlers-package: com.genius.primavera.domain