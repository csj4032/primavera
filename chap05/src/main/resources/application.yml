spring:
  application:
    name: MyBatisLoggingApplication
  profiles:
    active: local
    group:
      local:
        - console-appender
        - file-debug-appender
        - file-error-appender
        - file-info-appender
        - file-warn-appender
      test:
        - console-appender
      hikari-balanced:
        - console-appender
      hikari-minimal:
        - console-appender
      hikari-performance-focused:
        - console-appender
      hikari-resource-constrained:
        - console-appender
  jackson:
    time-zone: UTC

primavera:
  logs:
    path: ./logs
