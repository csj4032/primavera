spring:
  application:
    name: MyBatisLoggingApplication
  profiles:
    active: local
    group:
      local:
        - console-appender
        - file-debug-appender
        - file-error-appender
        - file-info-appender
        - file-warn-appender
      test:
        - console-appender
      hikari-balanced:
        - console-appender
      hikari-minimal:
        - console-appender
      hikari-performance-focused:
        - console-appender
      hikari-resource-constrained:
        - console-appender
  jackson:
    time-zone: UTC
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://localhost:1109/primavera?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
    username: primavera
    password: primavera

server:
  tomcat:
    use-apr: never

primavera:
  logs:
    path: ./logs
