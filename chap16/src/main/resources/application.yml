spring:
  application:
    name: FileProcessingMonitoringApplication
  profiles:
    active: local
    group:
      local:
        - console-appender
        - file-debug-appender
        - file-error-appender
        - file-info-appender
        - file-warn-appender
        - sentry-appender
      test:
        - console-appender
  jackson:
    time-zone: UTC
  jpa:
    show-sql: true
    generate-ddl: false
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        implicit-strategy: org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy
    properties:
      globally_quoted_identifiers: true
      jdbc:
        fetch_size: 30
        batch_size: 30
    open-in-view: false
  aop:
    proxy-target-class: false
    auto: false
  servlet:
    multipart:
      max-file-size: 128KB
      max-request-size: 128KB

logging:
  config: classpath:logback-spring.xml

primavera:
  config:
    name: primavera
    enabled: true
  logs:
    path: ./logs

server:
  tomcat:
    arp:
      enabled: false
  ssl:
    key-alias: primavera
    key-store: infrastructure/certs/primavera.p12
    key-store-type: PKCS12
    key-store-password: primavera
    enabled: true
  port: 8443