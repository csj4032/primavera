spring:
  config:
    activate:
      on-profile: test
  cloud:
    config:
      enabled: false
    vault:
      enabled: false
    aws:
      credentials:
        access-key: ${aws.credentials.access-key:${AWS_ACCESS_KEY_ID:test}}
        secret-key: ${aws.credentials.secret-key:${AWS_SECRET_ACCESS_KEY:test}}
      region:
        static: ${aws.region:${AWS_REGION:ap-northeast-2}}
      s3:
        bucket-name: ${aws.s3.bucket-name:${AWS_S3_BUCKET_NAME:test-primavera-bucket}}
        endpoint: ${aws.s3.endpoint:${AWS_S3_ENDPOINT:${aws.s3.localstack-endpoint:}}}
        path-style-access: ${aws.s3.path-style-access:${AWS_S3_PATH_STYLE_ACCESS:true}}