dependencies {
    implementation('org.springframework.boot:spring-boot-starter-web') {
        exclude module: "spring-boot-starter-tomcat"
    }
    implementation 'org.springframework.boot:spring-boot-starter-undertow'
    databaseDependencies.each { dep -> implementation dep }
    developmentDependencies.each { dep -> implementation dep }
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-hateoas'
    implementation "org.modelmapper:modelmapper:3.2.1"
    implementation "org.apache.tika:tika-core:1.18"
    implementation 'org.apache.tika:tika-parsers:1.18'
    implementation 'org.apache.pdfbox:jbig2-imageio:3.0.3'
    implementation 'com.github.jai-imageio:jai-imageio-jpeg2000:1.3.0'
    implementation 'org.apache.poi:poi:4.1.1'
    implementation 'org.apache.poi:poi-ooxml:4.1.1'
    implementation 'org.apache.poi:poi-scratchpad:4.1.1'
    implementation "com.monitorjbl:xlsx-streamer:2.1.0"
    implementation "org.xerial:sqlite-jdbc:3.50.1.0"
    implementation "org.javatuples:javatuples:1.2"
    // jOOλ (jool) - Functional programming utilities
    implementation 'org.jooq:jool:0.9.15'
    
    // DataFrame-like Libraries (Pandas equivalent for Java)
    implementation "tech.tablesaw:tablesaw-core:${tablesawVersion}"
    implementation "tech.tablesaw:tablesaw-excel:${tablesawVersion}"
    implementation "tech.tablesaw:tablesaw-aggregate:${tablesawVersion}"
    implementation "tech.tablesaw:tablesaw-jsplot:${tablesawVersion}"
    
    // Functional Data Structures
    implementation "io.vavr:vavr:${vavrVersion}"
    implementation "org.eclipse.collections:eclipse-collections:${eclipseCollectionsVersion}"
    implementation "org.eclipse.collections:eclipse-collections-api:${eclipseCollectionsVersion}"
    
    // Data Analysis & Machine Learning
    implementation "nz.ac.waikato.cms.weka:weka-stable:${wekaVersion}"
    implementation "org.apache.commons:commons-math3:${commonsMath3Version}"
    
    // CSV and Data Format Processing
    implementation "com.opencsv:opencsv:5.3"
    
    // Text Analysis
    implementation "org.openkoreantext:open-korean-text:2.3.1"
    
    // Monitoring
    implementation "io.sentry:sentry-logback:1.7.30"
}