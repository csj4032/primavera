plugins {
    id 'org.springframework.boot' version "${springBootVersion}"
    id 'io.spring.dependency-management' version "${springDependencyManagementVersion}"
}

dependencies {
    implementation('org.springframework.boot:spring-boot-starter-web') {
        exclude module: "spring-boot-starter-tomcat"
    }
    implementation('org.springframework.boot:spring-boot-starter-jdbc')
    implementation('org.springframework.boot:spring-boot-starter-data-jpa')
    implementation('org.springframework.boot:spring-boot-starter-undertow')
    implementation('org.springframework.boot:spring-boot-starter-hateoas')
    implementation('org.springframework.boot:spring-boot-devtools')
    implementation("org.springframework.hateoas:spring-hateoas:${springHateoasVersion}")
    implementation("org.springframework.plugin:spring-plugin-core:${springPluginCoreVersion}")
    implementation('org.mariadb.jdbc:mariadb-java-client:${mariadbVersion}')
    implementation("org.modelmapper:modelmapper:${modelMapperVersion}")
    implementation('org.projectlombok:lombok')
    implementation("org.apache.tika:tika-core:${tikaVersion}")
    implementation('org.apache.tika:tika-parsers:1.18')
    implementation('org.apache.pdfbox:jbig2-imageio:3.0.3')
    implementation("org.xerial:sqlite-jdbc:${sqliteJdbcVersion}")
    implementation('com.github.jai-imageio:jai-imageio-jpeg2000:1.3.0')
    implementation('org.apache.poi:poi:4.1.1')
    implementation('org.apache.poi:poi-ooxml:4.1.1')
    implementation('org.apache.poi:poi-scratchpad:4.1.1')
    implementation("com.monitorjbl:xlsx-streamer:${xlsxStreamerVersion}")
    implementation("org.javatuples:javatuples:${javatuplesVersion}")
    implementation("io.sentry:sentry-logback:${sentryVersion}")
    implementation("com.opencsv:opencsv:${openCsvVersion}")
    implementation("org.openkoreantext:open-korean-text:${openKoreanTextVersion}")
    annotationProcessor('org.projectlombok:lombok')
    testImplementation('org.springframework.boot:spring-boot-starter-test')
}