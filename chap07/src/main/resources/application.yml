spring:
  application:
    name: ThymeleafWebApplication
  profiles:
    active: local
    group:
      local:
        - console-appender
        - file-debug-appender
        - file-error-appender
        - file-info-appender
        - file-warn-appender
      test:
        - console-appender
  jackson:
    time-zone: UTC

server:
  tomcat:
    use-apr: never

lucy-filter:
  enabled: true
  name: xssEscapeServletFilter
  order: 1
  addUrlPatterns: /*

primavera:
  logs:
    path: ./logs