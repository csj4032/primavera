spring:
  application:
    name: chap02-app

plantPlaces:
  api:
    url: https://api.plantplaces.com

com:
  genius:
    primavera:
      database:
        username: test_user
        password: test_password123
        url: jdbc:mysql://localhost:1109/primavera?serverTimezone=UTC
        tables:
          - user
          - role
      search:
        params:
          keyword: spring
          page: 1
          sort: desc
          enable-highlight: true
        engines:
          - elasticsearch
          - solr
      users:
        - id: 1
          email: admin@primavera.com
          role: ADMIN
          active: true
        - id: 2
          email: user@primavera.com
          role: USER
          active: true
      features:
        darkMode: enabled
        betaFeatures: disabled
        maxUploadSize: 10MB
      cache:
        enabled: true
        time-to-live: 5m
        type: local
        max-entries: 1000