plugins {
    id 'org.springframework.boot' version "${springBootVersion}"
    id 'io.spring.dependency-management' version "${springDependencyManagementVersion}"
    id 'org.flywaydb.flyway' version "${flywayVersion}"
}

flyway {
    url = 'jdbc:mariadb://localhost:3306/primavera'
    user = 'primavera'
    password = 'primavera'
}

dependencies {
    implementation('org.springframework.boot:spring-boot-starter-web') {
        exclude module: "spring-boot-starter-tomcat"
    }
    implementation('org.springframework.boot:spring-boot-starter-aop')
    implementation('org.springframework.boot:spring-boot-starter-jdbc')
    implementation('org.springframework.boot:spring-boot-starter-json')
    implementation('org.springframework.boot:spring-boot-starter-data-jpa')
    implementation('org.springframework.boot:spring-boot-starter-thymeleaf')
    implementation('org.springframework.boot:spring-boot-devtools')
    implementation('org.springframework.boot:spring-boot-starter-security')
    implementation('org.springframework.boot:spring-boot-starter-validation')
    implementation('org.hibernate:hibernate-envers:' + hibernateVersion)
    // implementation('org.springframework.boot:spring-boot-starter-oauth2-client')
    implementation('org.thymeleaf.extras:thymeleaf-extras-springsecurity6:' + thymeleafExtrasSpringSecurity6Version)
    implementation('org.springframework.boot:spring-boot-starter-undertow')
    implementation('org.mybatis.spring.boot:mybatis-spring-boot-starter:' + mybatisSpringBootStarterVersion)
    implementation('org.mybatis.dynamic-sql:mybatis-dynamic-sql:' + mybatisDynamicSqlVersion)
    implementation('nz.net.ultraq.thymeleaf:thymeleaf-layout-dialect:' + thymeleafLayoutDialectVersion)
    implementation('com.navercorp.lucy:lucy-xss-servlet:' + lucyXssServletVersion)
    implementation("org.modelmapper:modelmapper:${modelMapperVersion}")
    implementation("org.flywaydb:flyway-core:${flywayVersion}")
    implementation("com.mysql:mysql-connector-j:${mysqlVersion}")
    implementation('org.jetbrains:annotations:' + jetbrainsAnnotationsVersion)
    compileOnly('org.projectlombok:lombok')
    annotationProcessor('org.projectlombok:lombok')
    testImplementation('org.springframework.boot:spring-boot-starter-test') {
        exclude module: 'junit'
        exclude module: 'junit-vintage-engine'
    }
    testImplementation('org.springframework.security:spring-security-test')
    testImplementation "org.testcontainers:junit-jupiter:${testContainersVersion}"
    testImplementation "org.testcontainers:mysql:${testContainersVersion}"
    testImplementation("io.rest-assured:rest-assured:${restAssuredVersion}")
    testRuntimeOnly('com.h2database:h2:' + h2Version)
}