spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:mariadb://prod-db-server:3306/primavera_mybatis_board?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=false
    username: ${DB_USERNAME:primavera}
    password: ${DB_PASSWORD:primavera}
  banner:
    charset: UTF-8
    location: classpath:primavera.txt
  thymeleaf:
    cache: true
    enabled: true
    prefix: classpath:/templates/
    suffix: .html
  devtools:
    livereload:
      enabled: false
  flyway:
    enabled: false
    table: SCHEMA_HISTORY
    baseline-description: "Production schema baseline"
  aop:
    proxy-target-class: true

logging:
  config: classpath:logback.xml
  level:
    com.genius.primavera: INFO
    root: WARN

server:
  ssl:
    key-alias: primavera
    key-store: ${SSL_KEYSTORE_PATH:chap12/primavera.p12}
    key-store-type: PKCS12
    key-store-password: ${SSL_KEYSTORE_PASSWORD:primavera}
    enabled: true
  port: 8443

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never