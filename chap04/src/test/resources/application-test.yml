spring:
  config:
    activate:
      on-profile: test
  cloud:
    config:
      enabled: false
    vault:
      enabled: false

testcontainers:
  containers:
    primavera:
      image: "mariadb:11.4.7"
      database: "primavera"
      username: "primavera"
      password: "primavera"
      startup-timeout: 120
      init-script: ./sql/init.sql
    valut:
      image: "hashicorp/vault:1.14.0"
      ports:
        - "8200:8200"
      environment:
        VAULT_DEV_ROOT_TOKEN_ID: ""
