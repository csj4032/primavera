
// chap17:common: JPA Entities only - 공통 엔티티 라이브러리
plugins {
    id 'java-library'
}

dependencies {
    // API dependencies (alphabetical)
    api "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
    api "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:${jacksonVersion}"
    api "org.springframework.boot:spring-boot-starter-data-elasticsearch"
    api "org.springframework.boot:spring-boot-starter-data-jpa"
    
    // Compile-only dependencies (alphabetical)
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    
    // Annotation processors
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    
    // Test implementation dependencies (alphabetical)
    testImplementation "org.junit.jupiter:junit-jupiter:${junitJupiterVersion}"
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

test {
    useJUnitPlatform()
}

bootJar {
    enabled = false
}

jar {
    enabled = true
    archiveClassifier = ''
}