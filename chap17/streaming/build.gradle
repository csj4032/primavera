plugins {
    id 'java'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
    id 'org.graalvm.buildtools.native'
}

group = 'com.genius.primavera'
version = '1.0.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    
    // Kafka
    implementation 'org.springframework.kafka:spring-kafka'
    implementation "org.apache.kafka:kafka-streams:${kafkaVersion}"
    
    // Database
    runtimeOnly "org.mariadb.jdbc:mariadb-java-client:${mariadbVersion}"
    
    // Elasticsearch
    implementation "co.elastic.clients:elasticsearch-java:${elasticsearchVersion}"
    implementation "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
    
    // Debezium (for CDC event model classes)
    implementation "io.debezium:debezium-api:${debeziumVersion}"
    implementation "io.debezium:debezium-embedded:${debeziumVersion}"
    
    // Utilities
    implementation "org.apache.commons:commons-lang3:${commonsLang3Version}"
    
    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.kafka:spring-kafka-test'
    testImplementation "org.testcontainers:junit-jupiter:${testContainersVersion}"
    testImplementation "org.testcontainers:kafka:${testContainersVersion}"
    testImplementation "org.testcontainers:mariadb:${testContainersVersion}"
    testImplementation "org.testcontainers:elasticsearch:${testContainersVersion}"
    
    // Annotation processors
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Native build configuration
graalvmNative {
    binaries {
        main {
            imageName = 'product-streaming-indexer'
            mainClass = 'com.genius.primavera.streaming.ProductStreamingApplication'
            useFatJar = false
        }
    }
}

// Application configuration
springBoot {
    mainClass = 'com.genius.primavera.streaming.ProductStreamingApplication'
    buildInfo()
}

// JAR configuration
jar {
    enabled = false
    archiveClassifier = ''
}

bootJar {
    archiveFileName = 'product-streaming-indexer.jar'
    launchScript()
}