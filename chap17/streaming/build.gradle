plugins {
    id 'org.graalvm.buildtools.native' version '0.10.3'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

dependencies {
    implementation project(':chap17:common')
    implementation "org.springframework.boot:spring-boot-starter-webflux"
    implementation "org.springframework.boot:spring-boot-starter-websocket"
    implementation "org.springframework.boot:spring-boot-starter-data-r2dbc"
    implementation "org.mariadb:r2dbc-mariadb:${r2dbcMariadbVersion}"
    implementation "io.r2dbc:r2dbc-pool:${r2dbcPoolVersion}"
    testImplementation "org.springframework.boot:spring-boot-starter-test"
    testImplementation "io.projectreactor:reactor-test:${reactorTestVersion}"
    testImplementation "org.testcontainers:junit-jupiter:${testContainersVersion}"
    testImplementation "org.testcontainers:r2dbc:${testContainersVersion}"
    testImplementation project(':appendix:spring-boot-starter-test-containers')
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.named('test') {
    useJUnitPlatform()
}

graalvmNative {
    binaries {
        main {
            imageName = 'product-streaming-indexer'
            mainClass = 'com.genius.primavera.streaming.ProductStreamingApplication'
            useFatJar = false
        }
    }
}

springBoot {
    mainClass = 'com.genius.primavera.streaming.ProductStreamingApplication'
    buildInfo()
}

jar {
    enabled = false
    archiveClassifier = ''
}

bootJar {
    archiveFileName = 'product-streaming-indexer.jar'
    launchScript()
}