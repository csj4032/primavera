plugins {
    id 'org.graalvm.buildtools.native'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation "org.apache.kafka:connect-api:${kafkaVersion}"
    implementation "org.apache.kafka:connect-runtime:${kafkaVersion}"
    runtimeOnly "org.mariadb.jdbc:mariadb-java-client:${mariadbVersion}"
    implementation "co.elastic.clients:elasticsearch-java:${elasticsearchVersion}"
    implementation "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
    implementation "io.debezium:debezium-embedded:${debeziumVersion}"
    implementation "io.debezium:debezium-connector-mariadb:${debeziumVersion}"
    implementation "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:${jacksonVersion}"
    implementation "org.apache.commons:commons-lang3:${commonsLang3Version}"
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation "org.testcontainers:junit-jupiter:${testContainersVersion}"
    testImplementation "org.testcontainers:mariadb:${testContainersVersion}"
    testImplementation "org.testcontainers:elasticsearch:${testContainersVersion}"
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

graalvmNative {
    binaries {
        main {
            imageName = 'product-streaming-indexer'
            mainClass = 'com.genius.primavera.streaming.ProductStreamingApplication'
            useFatJar = false
        }
    }
}

springBoot {
    mainClass = 'com.genius.primavera.streaming.ProductStreamingApplication'
    buildInfo()
}

jar {
    enabled = false
    archiveClassifier = ''
}

bootJar {
    archiveFileName = 'product-streaming-indexer.jar'
    launchScript()
}