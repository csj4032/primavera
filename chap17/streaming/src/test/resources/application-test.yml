spring:
  config:
    activate:
      on-profile: test
  cloud:
    config:
      enabled: false
    vault:
      enabled: false
  r2dbc:
    url: ${testcontainers.mariadb.r2dbc-url:r2dbc:h2:mem:///testdb}
    username: ${testcontainers.mariadb.username:sa}
    password: ${testcontainers.mariadb.password:}

testcontainers:
  mariadb:
    image: mariadb:11.4.7
    database: primavera
    username: primavera
    password: primavera
    init-script: sql/init.sql

debezium:
  enabled: false
