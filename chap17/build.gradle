repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

// Disable Spring Boot tasks for the root module (this is a multi-module project)
bootJar {
    enabled = false
}

jar {
    enabled = true
    archiveClassifier = ''
}