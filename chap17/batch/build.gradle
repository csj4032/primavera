
plugins {
    id 'org.graalvm.buildtools.native' version '0.10.3'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

// chap17:batch: Spring Batch + Web + JPA + Elasticsearch
dependencies {
    implementation project(':chap17:common')
    
    // Spring Batch + Web + JPA
    implementation "org.springframework.boot:spring-boot-starter-batch"
    implementation "org.springframework.boot:spring-boot-starter-web"
    implementation "org.springframework.boot:spring-boot-starter-data-jpa"
    
    // Elasticsearch
    implementation "co.elastic.clients:elasticsearch-java:${elasticsearchVersion}"
    
    // Database
    runtimeOnly "org.mariadb.jdbc:mariadb-java-client:${mariadbVersion}"
    
    testImplementation "org.springframework.boot:spring-boot-starter-test"
    testImplementation "org.springframework.batch:spring-batch-test"
    testImplementation "org.testcontainers:junit-jupiter:${testContainersVersion}"
    testImplementation "org.testcontainers:mariadb:${testContainersVersion}"
    testImplementation "org.testcontainers:elasticsearch:${testContainersVersion}"
    testImplementation project(':appendix:spring-boot-starter-test-containers')
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.named('test') {
    useJUnitPlatform()
}

graalvmNative {
    binaries {
        main {
            imageName = 'product-batch-indexer'
            mainClass = 'com.genius.primavera.ProductBatchApplication'
            useFatJar = false
        }
    }
}

springBoot {
    mainClass = 'com.genius.primavera.ProductBatchApplication'
    buildInfo()
}

jar {
    enabled = false
    archiveClassifier = ''
}

bootJar {
    archiveFileName = 'product-batch-indexer.jar'
    launchScript()
}