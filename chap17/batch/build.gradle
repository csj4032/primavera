// ==========================================
// CHAP17 Batch Processing Module
// ==========================================
// Spring Batch application with Elasticsearch integration
// GraalVM native image support for performance
// ==========================================

plugins {
    id 'org.graalvm.buildtools.native' version '0.10.3'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

dependencies {
    // ==========================================
    // Common Module Dependency
    // ==========================================
    implementation project(':chap17:common')
    
    // ==========================================
    // Spring Boot Batch Dependencies
    // ==========================================
    implementation 'org.springframework.boot:spring-boot-starter-batch'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // ==========================================
    // Database Dependencies
    // ==========================================
    runtimeOnly "org.mariadb.jdbc:mariadb-java-client:${mariadbVersion}"

    // ==========================================
    // Elasticsearch Dependencies
    // ==========================================
    implementation "co.elastic.clients:elasticsearch-java:${elasticsearchVersion}"
    implementation "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"

    // ==========================================
    // Utility Libraries
    // ==========================================
    implementation "org.apache.commons:commons-lang3:${commonsLang3Version}"
    implementation "org.apache.commons:commons-csv:${commonsCsvVersion}"

    // ==========================================
    // Test Dependencies
    // ==========================================
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.batch:spring-batch-test'
    testImplementation "org.testcontainers:junit-jupiter:${testContainersVersion}"
    testImplementation "org.testcontainers:mariadb:${testContainersVersion}"
    testImplementation "org.testcontainers:elasticsearch:${testContainersVersion}"

    // ==========================================
    // Annotation Processors
    // ==========================================
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Native build configuration
graalvmNative {
    binaries {
        main {
            imageName = 'product-batch-indexer'
            mainClass = 'com.genius.primavera.batch.ProductBatchApplication'
            useFatJar = false
        }
    }
}

// Application configuration
springBoot {
    mainClass = 'com.genius.primavera.batch.ProductBatchApplication'
    buildInfo()
}

// JAR configuration
jar {
    enabled = false
    archiveClassifier = ''
}

bootJar {
    archiveFileName = 'product-batch-indexer.jar'
    launchScript()
}