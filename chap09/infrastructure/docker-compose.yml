version: '3.8'

services:
  # MariaDB for SpringSecurityBasicApplication (chap09)
  mariadb-chap09:
    image: mariadb:11.4.7
    container_name: mariadb-primavera-chap09
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: primavera
      MARIADB_USER: primavera
      MARIADB_PASSWORD: primavera
      TZ: Asia/Seoul
    ports:
      - "3313:3306"
    volumes:
      - mariadb-chap09-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mariadb", "-uprimavera", "-pprimavera", "-e", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - chap09-network

  # Vault for Configuration Management
  vault-chap09:
    image: hashicorp/vault:1.15
    container_name: vault-primavera-chap09
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: 'primavera-vault-token'
      VAULT_DEV_LISTEN_ADDRESS: '0.0.0.0:8200'
      VAULT_LOG_LEVEL: 'info'
    ports:
      - "8205:8200"
    volumes:
      - vault-chap09-data:/vault/data
      - ./vault-init.sh:/vault-init.sh:ro
    command: >
      sh -c "vault server -dev -dev-root-token-id=primavera-vault-token &
             sleep 5 &&
             export VAULT_ADDR='http://0.0.0.0:8200' &&
             export VAULT_TOKEN='primavera-vault-token' &&
             vault kv put secret/SpringSecurityBasicApplication/local \
               spring.datasource.driver-class-name=org.mariadb.jdbc.Driver \
               spring.datasource.url=jdbc:mariadb://mariadb-chap09:3306/primavera \
               spring.datasource.username=primavera \
               spring.datasource.password=primavera &&
             tail -f /dev/null"
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      mariadb-chap09:
        condition: service_healthy
    networks:
      - chap09-network

volumes:
  mariadb-chap09-data:
    name: mariadb-chap09-data
  vault-chap09-data:
    name: vault-chap09-data

networks:
  chap09-network:
    name: primavera-chap09-network
    driver: bridge
