spring:
  application:
    name: SpringSecurityBasicApplication
  profiles:
    active: local
    group:
      local:
        - console-appender
        - file-debug-appender
        - file-error-appender
        - file-info-appender
        - file-warn-appender
      test:
        - console-appender
  jackson:
    time-zone: UTC

lucy-filter:
  enabled: true
  name: lucy-filter
  order: 0
  addUrlPatterns: /*

logging:
  config: classpath:logback-spring.xml

primavera:
  logs:
    path: ./logs