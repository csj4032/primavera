spring:
  config:
    activate:
      on-profile: local
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://localhost:1109/primavera?serverTimezone=UTC
    username: primavera
    password: primavera
  thymeleaf:
    cache: false
    enabled: true
    prefix: classpath:/templates/
    suffix: .html
  lucy-filter:
    enabled: true
    name: lucy-filter
    order: 0
    addUrlPatterns: /*

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 1000
    default-statement-timeout: 30
  type-aliases-package: com.genius.primavera.domain.model
  type-handlers-package: com.genius.primavera.domain.model