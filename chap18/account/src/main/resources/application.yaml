spring:
  application:
    name: AccountApplication
  profiles:
    active: local
    group:
      local:
        - console-appender
        - file-debug-appender
        - file-error-appender
        - file-info-appender
        - file-warn-appender
      test:
        - console-appender
  jackson:
    time-zone: UTC

server:
  port: 8080
  tomcat:
    threads:
      max: 1

logging:
  config: classpath:logback-spring.xml

primavera:
  config:
    name: account
    enabled: true
    logs:
      path: ./logs/${primavera.config.name}