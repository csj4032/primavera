spring:
  application:
    name: AccountApplication
  config:
    import: optional:configserver:http://localhost:8888
  cloud:
    config:
      name: account
      profile: ${spring.profiles.active:default}
      label: master
      uri: http://localhost:8888
      fail-fast: false
      retry:
        initial-interval: 1000
        max-interval: 2000
        max-attempts: 5