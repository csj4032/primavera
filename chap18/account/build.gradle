// ==========================================
// CHAP18 Account Microservice
// ==========================================
// User account management service
// Reactive WebFlux with Redis cache
// ==========================================

plugins {
    id 'org.springframework.boot' version "${springBootVersion}"
    id 'io.spring.dependency-management' version "${springDependencyManagementVersion}"
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

dependencies {
    // ==========================================
    // Spring Boot Reactive Dependencies
    // ==========================================
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    implementation 'org.springframework.boot:spring-boot-devtools'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive'
    
    // ==========================================
    // Spring Cloud Dependencies
    // ==========================================
    implementation 'org.springframework.cloud:spring-cloud-starter-config'
    
    // ==========================================
    // Object Mapping
    // ==========================================
    implementation "org.modelmapper:modelmapper:${modelMapperVersion}"
    
    // ==========================================
    // Lombok Support
    // ==========================================
    implementation 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    
    // ==========================================
    // HTTP Client
    // ==========================================
    implementation "com.squareup.okhttp3:okhttp:${okhttpVersion}"
    
    // ==========================================
    // JSON Processing
    // ==========================================
    implementation "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:${jacksonJsr310Version}"
    implementation "com.fasterxml.jackson.datatype:jackson-datatype-jdk8:${jacksonJdk8Version}"
    
    // ==========================================
    // Test Dependencies
    // ==========================================
    testImplementation('org.springframework.boot:spring-boot-starter-test') {
        exclude module: 'junit'
        exclude module: 'junit-vintage-engine'
    }
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation "io.projectreactor:reactor-test:${reactorTestVersion}"
}