// ==========================================
// CHAP18 Order Microservice
// ==========================================
// Order processing service with R2DBC
// Kafka integration for event streaming
// ==========================================

plugins {
    id 'org.springframework.boot' version "${springBootVersion}"
    id 'io.spring.dependency-management' version "${springDependencyManagementVersion}"
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

dependencies {
    // ==========================================
    // Spring Boot Reactive Dependencies
    // ==========================================
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    implementation 'org.springframework.boot:spring-boot-devtools'
    
    // ==========================================
    // R2DBC Reactive Database Access
    // ==========================================
    implementation 'org.springframework.data:spring-data-r2dbc'
    implementation "org.mariadb:r2dbc-mariadb:${r2dbcMariadbVersion}"
    implementation "io.r2dbc:r2dbc-pool:${r2dbcPoolVersion}"
    
    // ==========================================
    // Spring Cloud Dependencies
    // ==========================================
    implementation 'org.springframework.cloud:spring-cloud-starter-config'
    
    // ==========================================
    // Object Mapping
    // ==========================================
    implementation "org.modelmapper:modelmapper:${modelMapperVersion}"
    
    // ==========================================
    // Lombok Support
    // ==========================================
    implementation 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    
    // ==========================================
    // HTTP Client
    // ==========================================
    implementation "com.squareup.okhttp3:okhttp:${okhttpVersion}"
    
    // ==========================================
    // Validation
    // ==========================================
    implementation "org.hibernate:hibernate-validator:${hibernateValidatorLegacyVersion}"
    
    // ==========================================
    // Kafka Dependencies
    // ==========================================
    implementation 'org.springframework.kafka:spring-kafka'
    implementation "org.apache.kafka:kafka-streams:${kafkaVersion}"
    
    // ==========================================
    // JSON Processing
    // ==========================================
    implementation "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
    implementation "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:${jacksonVersion}"
    
    // ==========================================
    // Test Dependencies
    // ==========================================
    testImplementation('org.springframework.boot:spring-boot-starter-test') {
        exclude module: 'junit'
        exclude module: 'junit-vintage-engine'
    }
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation "io.projectreactor:reactor-test:${reactorTestVersion}"
}