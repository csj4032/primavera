// ==========================================
// CHAP18 - Microservices Architecture
// ==========================================
// Root module for microservices architecture
// Sub-modules: account, order, product, configuration, front
// ==========================================

plugins {
    id 'io.spring.dependency-management' version "${springDependencyManagementVersion}"
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

// Disable Spring Boot tasks for the root module (this is a multi-module microservices project)
bootJar {
    enabled = false
}

jar {
    enabled = true
    archiveClassifier = ''
}