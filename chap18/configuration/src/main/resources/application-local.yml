server:
  port: 8888

spring:
  application:
    name: ConfigurationApplication
  cloud:
    config:
      server:
        composite:
          - type: native
            search-locations: classpath:/config
            order: 1
          - type: vault
            host: 127.0.0.1
            port: 8200
            scheme: http
            backend: secret
            profile-separator: /
            default-key: application
            authentication: TOKEN
            token: primavera-vault-token
            order: 2
        bootstrap: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh
  endpoint:
    health:
      show-details: always