spring:
  application:
    name: ConfigurationApplication
  profiles:
    active: local
    group:
      local:
        - console-appender
        - file-debug-appender
        - file-error-appender
        - file-info-appender
        - file-warn-appender
      test:
        - console-appender
  jackson:
    time-zone: UTC
  cloud:
    config:
      server:
        encrypt:
          enabled: false
        git:
          uri: git@github.com:csj4032/config-repo.git
          search-paths: account, front, order, product

server:
  port: 8081

lucy-filter:
  enabled: true
  name: lucyXssFilter
  order: 1
  addUrlPatterns: /*

logging:
  config: classpath:logback-spring.xml

primavera:
  config:
    name: configuration
    logs:
      path: ./logs/${primavera.config.name}