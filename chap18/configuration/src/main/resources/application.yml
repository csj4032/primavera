spring:
  application:
    name: ConfigurationApplication
  profiles:
    active: native
    group:
      local:
        - console-appender
        - file-debug-appender
        - file-error-appender
        - file-info-appender
        - file-warn-appender
      test:
        - console-appender
  cloud:
    config:
      server:
        native:
          search-locations: classpath:/config
        bootstrap: false

logging:
  config: classpath:logback-spring.xml

server:
  port: 8888