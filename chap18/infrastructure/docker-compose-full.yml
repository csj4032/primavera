version: '3.8'

services:
  # Zookeeper for Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper-primavera-chap18
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log
    networks:
      - chap18-network

  # Kafka Message Broker
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-primavera-chap18
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - chap18-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # MongoDB for Product Service
  mongodb:
    image: mongo:7.0
    container_name: mongodb-primavera-chap18
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: primavera
      MONGO_INITDB_DATABASE: primavera_products
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
      - mongodb-config:/data/configdb
    networks:
      - chap18-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Vault for Configuration Management
  vault:
    image: hashicorp/vault:1.15
    container_name: vault-primavera-chap18
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: 'primavera-vault-token'
      VAULT_DEV_LISTEN_ADDRESS: '0.0.0.0:8200'
      VAULT_LOG_LEVEL: 'info'
    ports:
      - "8200:8200"
    volumes:
      - vault-data:/vault/data
      - ./vault-init.sh:/vault-init.sh:ro
    command: >
      sh -c "vault server -dev -dev-root-token-id=primavera-vault-token &
             sleep 5 &&
             /vault-init.sh &&
             tail -f /dev/null"
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - chap18-network

  # Redis for caching and session management
  redis:
    image: redis:7.4-alpine
    container_name: redis-primavera-chap18
    restart: unless-stopped
    command: redis-server --requirepass primavera --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "primavera", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - chap18-network

  # MariaDB for persistent storage
  mariadb:
    image: mariadb:11.4.7
    container_name: mariadb-primavera-chap18
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: primavera
      MARIADB_USER: primavera
      MARIADB_PASSWORD: primavera
      TZ: Asia/Seoul
    ports:
      - "3318:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mariadb", "-uprimavera", "-pprimavera", "-e", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - chap18-network

  # Kafka UI (Optional - for monitoring)
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui-primavera-chap18
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9093
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - chap18-network

volumes:
  vault-data:
    name: vault-chap18-data
  redis-data:
    name: redis-chap18-data
  mariadb-data:
    name: mariadb-chap18-data
  mongodb-data:
    name: mongodb-chap18-data
  mongodb-config:
    name: mongodb-chap18-config
  kafka-data:
    name: kafka-chap18-data
  zookeeper-data:
    name: zookeeper-chap18-data
  zookeeper-logs:
    name: zookeeper-chap18-logs

networks:
  chap18-network:
    name: primavera-chap18-network
    driver: bridge