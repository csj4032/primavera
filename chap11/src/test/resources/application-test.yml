spring:
  application:
    name: primavera-test
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # URL will be dynamically set by TestContainers
    url: jdbc:mysql://localhost:3306/primavera_test?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: test
    password: test
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        show_sql: true
        format_sql: true
  flyway:
    enabled: false
  sql:
    init:
      mode: never

# OAuth2 환경변수 기본값 설정 (테스트용)
google:
  client:
    clientId: test-client-id
    clientSecret: test-client-secret
    redirectUri: http://localhost:8080/login/oauth2/code/google

facebook:
  client:
    clientId: test-facebook-id
    clientSecret: test-facebook-secret
    redirectUri: http://localhost:8080/login/oauth2/code/facebook

github:
  client:
    clientId: test-github-id
    clientSecret: test-github-secret
    redirectUri: http://localhost:8080/login/oauth2/code/github

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    com.genius.primavera: DEBUG
    root: WARN