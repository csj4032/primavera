spring:
  application:
    name: primavera-test
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        show_sql: true
        format_sql: true
  flyway:
    enabled: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql
      platform: h2

# OAuth2 환경변수 기본값 설정 (테스트용)
google:
  client:
    clientId: test-google-client-id
    clientSecret: test-google-client-secret
    
facebook:
  client:
    clientId: test-facebook-client-id
    clientSecret: test-facebook-client-secret
    
github:
  client:
    clientId: test-github-client-id
    clientSecret: test-github-client-secret
      
mybatis:
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 1000
    default-statement-timeout: 30
  type-aliases-package: com.genius.primavera.domain
  type-handlers-package: com.genius.primavera.domain

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    com.genius.primavera: DEBUG