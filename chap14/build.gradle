dependencies {
    // Implementation dependencies (alphabetical)
    implementation "com.esotericsoftware:kryo:4.0.3"
    implementation "com.github.ben-manes.caffeine:caffeine:3.1.8"
    implementation "com.querydsl:querydsl-apt"
    implementation "com.querydsl:querydsl-jpa"
    implementation "com.squareup.retrofit2:converter-jackson:${retrofitVersion}"
    implementation "com.squareup.retrofit2:retrofit:${retrofitVersion}"
    implementation "jakarta.persistence:jakarta.persistence-api"
    implementation "org.apache.commons:commons-lang3:3.14.0"
    implementation "org.apache.commons:commons-pool2:2.12.0"
    implementation "org.hibernate:hibernate-envers:${hibernateEnversVersion}"
    implementation "org.jooq:jool:0.9.15"
    implementation "org.mariadb.jdbc:mariadb-java-client:${mariadbVersion}"
    implementation "org.modelmapper:modelmapper:3.2.0"
    implementation "org.springframework.boot:spring-boot-starter-actuator"
    implementation "org.springframework.boot:spring-boot-starter-data-jpa"
    implementation "org.springframework.boot:spring-boot-starter-data-mongodb-reactive"
    implementation "org.springframework.boot:spring-boot-starter-data-redis-reactive"
    implementation "org.springframework.boot:spring-boot-starter-jdbc"
    implementation "org.springframework.boot:spring-boot-starter-oauth2-client"
    implementation "org.springframework.boot:spring-boot-starter-security"
    implementation "org.springframework.boot:spring-boot-starter-validation"
    implementation "org.springframework.boot:spring-boot-starter-web"
    implementation "org.springframework.boot:spring-boot-starter-webflux"
    implementation "org.springframework.data:spring-data-envers"
    implementation "org.xerial.snappy:snappy-java:1.1.10.5"
    
    // Annotation processors
    annotationProcessor "com.querydsl:querydsl-apt:${querydslVersion}:jakarta"
    annotationProcessor "jakarta.persistence:jakarta.persistence-api"
    
    // Test implementation dependencies (alphabetical)
    testImplementation "io.projectreactor:reactor-test:${reactorTestVersion}"
    testImplementation "org.springframework.security:spring-security-test"
    testImplementation "org.testcontainers:junit-jupiter:${testContainersVersion}"
    testImplementation "org.testcontainers:mariadb:${testContainersVersion}"
    testImplementation "org.testcontainers:mongodb:${testContainersVersion}"
    testImplementation project(':appendix:spring-boot-starter-test-containers')
}

def querydslSrcDir = 'src/main/java'

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java', querydslSrcDir]
        }
    }
}