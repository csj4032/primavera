// ==========================================
// CHAP14 - Spring Data Envers & Auditing
// ==========================================
// Dependencies inherited from root build.gradle:
// - spring-boot-starter-web ✓
// - lombok (compileOnly + annotationProcessor) ✓  
// - spring-boot-starter-test ✓
// - slf4j-api ✓
// - jetbrains annotations ✓
// - jakarta.validation-api (compileOnly) ✓
// ==========================================

def querydslSrcDir = 'src/main/java'

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java', querydslSrcDir]
        }
    }
}

dependencies {
    // ==========================================
    // Web Server Configuration (Exclude Tomcat)
    // ==========================================
    implementation('org.springframework.boot:spring-boot-starter-web') {
        exclude module: "spring-boot-starter-tomcat"
    }
    implementation 'org.springframework.boot:spring-boot-starter-undertow'
    
    // ==========================================
    // Reactive Dependencies
    // ==========================================
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-reactor-netty'
    
    // ==========================================
    // AOP Dependencies
    // ==========================================
    aopDependencies.each { dep -> implementation dep }
    
    // ==========================================
    // Database Dependencies  
    // ==========================================
    databaseDependencies.each { dep -> implementation dep }
    
    // ==========================================
    // Validation Dependencies
    // ==========================================
    validationDependencies.each { dep -> implementation dep }
    
    // ==========================================
    // Development Dependencies
    // ==========================================
    developmentDependencies.each { dep -> implementation dep }
    
    // ==========================================
    // Thymeleaf Dependencies
    // ==========================================
    thymeleafDependencies.each { dep -> implementation dep }
    
    // ==========================================
    // TestContainers Dependencies
    // ==========================================
    testContainersDependencies.each { dep -> testImplementation dep }
    
    // ==========================================
    // Spring Boot Starters
    // ==========================================
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-json'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb-reactive'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-authorization-server'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    
    // ==========================================
    // Spring Cloud Dependencies
    // ==========================================
    implementation "org.springframework.cloud:spring-cloud-starter-config"
    implementation "org.springframework.cloud:spring-cloud-starter-vault-config:${springCloudVaultVersion}"
    
    // ==========================================
    // Thymeleaf Security Integration
    // ==========================================
    implementation "org.thymeleaf.extras:thymeleaf-extras-springsecurity6:${thymeleafExtrasSpringSecurity6Version}"
    
    // ==========================================
    // JPA Auditing
    // ==========================================
    implementation 'org.springframework.data:spring-data-envers'
    
    // ==========================================
    // Object Mapping
    // ==========================================
    implementation "org.modelmapper:modelmapper:${modelMapperVersion}"
    
    // ==========================================
    // Database Migration
    // ==========================================
    implementation "org.flywaydb:flyway-core:${flywayVersion}"
    
    // ==========================================
    // Performance Dependencies
    // ==========================================
    implementation "org.jctools:jctools-core:${jctoolsCoreVersion}"
    implementation "com.github.ben-manes.caffeine:caffeine:${caffeineVersion}"
    implementation "com.esotericsoftware:kryo:${kryoVersion}"
    implementation "org.xerial.snappy:snappy-java:${snappyJavaVersion}"
    implementation "org.apache.commons:commons-pool2:${commonsPoolVersion}"
    
    // ==========================================
    // Query DSL
    // ==========================================
    implementation 'com.querydsl:querydsl-jpa'
    implementation 'com.querydsl:querydsl-apt'
    annotationProcessor "com.querydsl:querydsl-apt:${dependencyManagement.importedProperties['querydsl.version']}:jpa"
    
    // ==========================================
    // HTTP Client
    // ==========================================
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-jackson:2.9.0'
    
    // ==========================================
    // Utility Libraries
    // ==========================================
    implementation 'org.jooq:jool:0.9.15'
    implementation "org.apache.commons:commons-lang3:${commonsLangVersion}"
    
    // ==========================================
    // Legacy API Support
    // ==========================================
    implementation "jakarta.persistence:jakarta.persistence-api"
    implementation "javax.persistence:javax.persistence-api:2.2"
    implementation "javax.servlet:javax.servlet-api:4.0.1"
    
    // ==========================================
    // Annotation Processors
    // ==========================================
    annotationProcessor "jakarta.persistence:jakarta.persistence-api"
    annotationProcessor "jakarta.annotation:jakarta.annotation-api"
    annotationProcessor "javax.persistence:javax.persistence-api:2.2"
    
    // ==========================================
    // Security Test Dependencies
    // ==========================================
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation "io.rest-assured:rest-assured:${restAssuredVersion}"
    testImplementation "javax.persistence:javax.persistence-api:2.2"
    testImplementation "javax.servlet:javax.servlet-api:4.0.1"
    
    // ==========================================
    // Test Support Dependencies
    // ==========================================
    testImplementation project(':appendix:spring-boot-starter-test-containers')
    
    // ==========================================
    // Project Module Dependencies
    // ==========================================
    implementation project(":appendix:spring-boot-starter-lucy-filter")
    testImplementation project(":appendix:spring-boot-starter-lucy-filter")
}