spring:
  application:
    name: AdvancedJpaApplication
  banner:
    charset: UTF-8
    location: classpath:banner.txt
  profiles:
    group:
      local:
        - console-appender
        - file-debug-appender
        - file-error-appender
        - file-info-appender
        - file-warn-appender
      test:
        - console-appender
  aop:
    proxy-target-class: true
  jackson:
    time-zone: UTC
  flyway:
    enabled: false
    encoding: UTF-8
    fail-on-missing-locations: false
    locations: classpath:db/migration
    table: SCHEMA_HISTORY
    baseline-on-migrate: false
    baseline-description: schema history
  webflux:
    base-path: /
    static-path-pattern: /static/**
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:your-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:your-google-client-secret}
          kakao:
            client-id: ${KAKAO_CLIENT_ID:your-kakao-client-id}
            client-secret: ${KAKAO_CLIENT_SECRET:your-kakao-client-secret}
            scope: profile_nickname, profile_image, account_email
            redirect-uri: http://localhost:8443/login/oauth2/code/kakao
            authorization-grant-type: authorization_code
            client-name: kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

lucy-filter:
  enabled: true
  name: lucyXssFilter
  order: 1
  addUrlPatterns: /*

logging:
  config: classpath:logback-spring.xml

