storage:
  location: upload-files
  max-file-size: 10MB
  max-request-size: 10MB

kakao:
  api:
    url: https://kapi.kakao.com
    talk-social:
      friend-list: v1/api/talk/friends
    timeout: 5000

cache:
  caffeine:
    spec: "maximumSize=1000,expireAfterWrite=10m"
  redis:
    ttl: 600

primavera:
  logs:
    path: ./logs