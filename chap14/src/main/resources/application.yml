spring:
  application:
    name: AdvancedJpaApplication
  banner:
    charset: UTF-8
    location: classpath:banner.txt
  profiles:
    group:
      local:
        - console-appender
        - file-debug-appender
        - file-error-appender
        - file-info-appender
        - file-warn-appender
      test:
        - console-appender
  aop:
    proxy-target-class: true
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
  devtools:
    livereload:
      enabled: false
    restart:
      enabled: false
  flyway:
    enabled: false
    encoding: UTF-8
    fail-on-missing-locations: false
    locations: classpath:db/migration
    table: SCHEMA_HISTORY
    baseline-on-migrate: false
    baseline-description: schema history
  webflux:
    base-path: /
    static-path-pattern: /static/**
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:your-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:your-google-client-secret}
          kakao:
            client-id: ${KAKAO_CLIENT_ID:your-kakao-client-id}
            client-secret: ${KAKAO_CLIENT_SECRET:your-kakao-client-secret}

lucy-filter:
  enabled: true
  name: lucyXssFilter
  order: 1
  addUrlPatterns: /*

logging:
  config: classpath:logback-spring.xml

server:
  port: 8443
  http2:
    enabled: true
  ssl:
    enabled: false
    key-alias: primavera
    key-store: classpath:certs/primavera.p12
    key-store-type: PKCS12
    key-store-password: primavera
  error:
    include-message: always
    include-binding-errors: always
  compression:
    enabled: true
  netty:
    connection-timeout: 30s
    idle-timeout: 60s

storage:
  location: upload-files
  max-file-size: 10MB
  max-request-size: 10MB

kakao:
  api:
    url: https://kapi.kakao.com
    talk-social:
      friend-list: v1/api/talk/friends
    timeout: 5000

cache:
  caffeine:
    spec: "maximumSize=1000,expireAfterWrite=10m"
  redis:
    ttl: 600

primavera:
  logs:
    path: ./logs