spring:
  application:
    name: AdvancedAuthorizationApplication
  banner:
    charset: UTF-8
    location: classpath:banner.txt
  profiles:
    group:
      local:
        - console-appender
        - file-debug-appender
        - file-error-appender
        - file-info-appender
        - file-warn-appender
      test:
        - console-appender
  jackson:
    time-zone: UTC

lucy-filter:
  name: lucyXssFilter
  order: 1
  addUrlPatterns: /*

logging:
  config: classpath:logback-spring.xml

