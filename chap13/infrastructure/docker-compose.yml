version: '3.8'

services:
  mariadb-chap13:
    image: mariadb:11.4.7
    container_name: mariadb-primavera-chap13
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: primavera
      MARIADB_USER: primavera
      MARIADB_PASSWORD: primavera
      TZ: Asia/Seoul
    ports:
      - "3317:3306"
    volumes:
      - mariadb-chap13-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [ "CMD", "mariadb", "-uprimavera", "-pprimavera", "-e", "SELECT 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - chap13-network

  mongodb-chap13:
    image: mongo:7.0
    container_name: mongodb-primavera-chap13
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: primavera
      MONGO_INITDB_ROOT_PASSWORD: primavera
      MONGO_INITDB_DATABASE: primavera
      TZ: UTC
    ports:
      - "27017:27017"
    volumes:
      - mongodb-chap13-data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - chap13-network

  vault-chap13:
    image: hashicorp/vault:1.15
    container_name: vault-primavera-chap13
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: 'primavera-vault-token'
      VAULT_DEV_LISTEN_ADDRESS: '0.0.0.0:8200'
      VAULT_LOG_LEVEL: 'info'
    ports:
      - "8200:8200"
    volumes:
      - vault-chap13-data:/vault/data
      - ./vault-init.sh:/vault-init.sh:ro
    command: >
      sh -c "vault server -dev -dev-root-token-id=primavera-vault-token &
             sleep 5 &&
             export VAULT_ADDR='http://0.0.0.0:8200' &&
             export VAULT_TOKEN='primavera-vault-token' &&
             vault kv put secret/AdvancedAuthorizationApplication/local \
               spring.datasource.driver-class-name=org.mariadb.jdbc.Driver \
               spring.datasource.url=jdbc:mariadb://mariadb-chap13:3306/primavera \
               spring.datasource.username=primavera \
               spring.datasource.password=primavera \
               spring.data.mongodb.host=mongodb-chap13 \
               spring.data.mongodb.port=27017 \
               spring.data.mongodb.database=primavera \
               spring.data.mongodb.username=primavera \
               spring.data.mongodb.password=primavera \
               spring.data.mongodb.authentication-database=admin &&
             tail -f /dev/null"
    healthcheck:
      test: [ "CMD", "vault", "status" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      mariadb-chap13:
        condition: service_healthy
      mongodb-chap13:
        condition: service_healthy
    networks:
      - chap13-network

volumes:
  mariadb-chap13-data:
    name: mariadb-chap13-data
  mongodb-chap13-data:
    name: mongodb-chap13-data
  vault-chap13-data:
    name: vault-chap13-data

networks:
  chap13-network:
    name: primavera-chap13-network
    driver: bridge