  zookeeper-${CHAPTER}:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper-primavera-${CHAPTER}
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "${ZOOKEEPER_PORT}:2181"
    volumes:
      - zookeeper-${CHAPTER}-data:/var/lib/zookeeper/data
      - zookeeper-${CHAPTER}-log:/var/lib/zookeeper/log
    networks:
      - ${CHAPTER}-network

  kafka-${CHAPTER}:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka-primavera-${CHAPTER}
    restart: unless-stopped
    depends_on:
      - zookeeper-${CHAPTER}
    ports:
      - "${KAFKA_PORT}:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-${CHAPTER}:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:${KAFKA_PORT}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    volumes:
      - kafka-${CHAPTER}-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ${CHAPTER}-network