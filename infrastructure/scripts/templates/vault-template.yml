  vault-${CHAPTER}:
    image: hashicorp/vault:1.15
    container_name: vault-primavera-${CHAPTER}
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: 'primavera-vault-token'
      VAULT_DEV_LISTEN_ADDRESS: '0.0.0.0:8200'
      VAULT_LOG_LEVEL: 'info'
    ports:
      - "${VAULT_PORT}:8200"
    volumes:
      - vault-${CHAPTER}-data:/vault/data
      - ${VAULT_INIT_PATH}:/vault-init.sh:ro
    command: >
      sh -c "vault server -dev -dev-root-token-id=primavera-vault-token &
             sleep 5 &&
             export VAULT_ADDR='http://0.0.0.0:8200' &&
             export VAULT_TOKEN='primavera-vault-token' &&
             vault kv put secret/${APP_NAME}/local \\
               spring.datasource.driver-class-name=org.mariadb.jdbc.Driver \\
               spring.datasource.url=jdbc:mariadb://localhost:${MARIADB_PORT}/primavera \\
               spring.datasource.username=primavera \\
               spring.datasource.password=primavera \\
               spring.data.mongodb.host=localhost \\
               spring.data.mongodb.port=${MONGODB_PORT:-27017} \\
               spring.data.mongodb.database=primavera \\
               spring.data.redis.host=localhost \\
               spring.data.redis.port=${REDIS_PORT:-6379} &&
             tail -f /dev/null"
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      mariadb-${CHAPTER}:
        condition: service_healthy
    networks:
      - ${CHAPTER}-network