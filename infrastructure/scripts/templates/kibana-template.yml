  kibana-${CHAPTER}:
    image: docker.elastic.co/kibana/kibana:8.12.0
    container_name: kibana-primavera-${CHAPTER}
    restart: unless-stopped
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch-${CHAPTER}:9200
      SERVER_NAME: kibana-primavera
      SERVER_BASEPATH: ""
    ports:
      - "${KIBANA_PORT}:5601"
    depends_on:
      elasticsearch-${CHAPTER}:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - ${CHAPTER}-network