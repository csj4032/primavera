services:
  mariadb:
    image: mariadb:11.4.7
    container_name: mariadb-primavera
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: primavera
      MARIADB_USER: primavera
      MARIADB_PASSWORD: primavera
      MARIADB_AUTO_UPGRADE: 1
      TZ: UTC
    ports:
      - "1109:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-time-zone='+00:00'
    networks:
      - primavera-network

  vault:
    image: hashicorp/vault:1.15
    container_name: vault-primavera
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: primavera-dev-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_LOG_LEVEL: info
      VAULT_ADDR: http://127.0.0.1:8200
    ports:
      - "8200:8200"
    volumes:
      - vault_data:/vault/data
      - vault_tokens:/vault/tokens
      - ./vault:/vault/config
    networks:
      - primavera-network
    healthcheck:
      test: ["CMD", "sh", "-c", "VAULT_ADDR=http://127.0.0.1:8200 vault status"]
      interval: 10s
      timeout: 5s
      retries: 5

  vault-init:
    image: hashicorp/vault:1.15
    container_name: vault-init-primavera
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: primavera-dev-token
    volumes:
      - vault_tokens:/vault/tokens
      - ./vault:/vault/config
      - ./vault-init.sh:/vault-init.sh
    networks:
      - primavera-network
    command: |
      sh -c "
        echo 'Waiting for Vault to be ready...'
        sleep 10
        apk add --no-cache curl jq
        sh /vault-init.sh
      "
    restart: "no"

  # Redis - Session store & caching for microservices
  redis:
    image: redis:7-alpine
    container_name: redis-primavera
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - primavera-network
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB - Document database for product service
  mongodb:
    image: mongo:7
    container_name: mongodb-primavera
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: primavera
      MONGO_INITDB_DATABASE: primavera_products
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - primavera-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Zookeeper - Kafka dependency
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper-primavera
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SYNC_LIMIT: 2
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log
    networks:
      - primavera-network
    healthcheck:
      test: ["CMD", "bash", "-c", "echo 'ruok' | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka - Message broker for event streaming
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka-primavera
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - primavera-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5


  # Elasticsearch - Search engine for product indexing
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: elasticsearch-primavera
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - primavera-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Sentry PostgreSQL - Database for error tracking
  sentry-postgres:
    image: postgres:13
    container_name: sentry-postgres-primavera
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: sentrypassword
      POSTGRES_USER: sentry
      POSTGRES_DB: sentry
      TZ: UTC
    volumes:
      - sentry_postgres_data:/var/lib/postgresql/data
    networks:
      - primavera-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentry"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Sentry Web - Error tracking and monitoring
  sentry-web:
    image: getsentry/sentry:24.1.0
    platform: linux/amd64
    container_name: sentry-web-primavera
    restart: unless-stopped
    depends_on:
      sentry-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SENTRY_SECRET_KEY: "primavera-sentry-secret-key-change-in-production"
      SENTRY_POSTGRES_HOST: sentry-postgres
      SENTRY_POSTGRES_PORT: 5432
      SENTRY_DB_NAME: sentry
      SENTRY_DB_USER: sentry
      SENTRY_DB_PASSWORD: sentrypassword
      SENTRY_REDIS_HOST: redis
      SENTRY_REDIS_PORT: 6379
      SENTRY_SINGLE_ORGANIZATION: 'true'
      SENTRY_USE_SSL: 'false'
      SENTRY_WEB_HOST: 0.0.0.0
      SENTRY_WEB_PORT: 9000
    ports:
      - "9000:9000"
    volumes:
      - sentry_data:/var/lib/sentry/files
    networks:
      - primavera-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/_health/"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Sentry Cron - Background task scheduler
  sentry-cron:
    image: getsentry/sentry:24.1.0
    platform: linux/amd64
    container_name: sentry-cron-primavera
    restart: unless-stopped
    depends_on:
      sentry-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sentry run cron
    environment:
      SENTRY_SECRET_KEY: "primavera-sentry-secret-key-change-in-production"
      SENTRY_POSTGRES_HOST: sentry-postgres
      SENTRY_POSTGRES_PORT: 5432
      SENTRY_DB_NAME: sentry
      SENTRY_DB_USER: sentry
      SENTRY_DB_PASSWORD: sentrypassword
      SENTRY_REDIS_HOST: redis
      SENTRY_REDIS_PORT: 6379
    networks:
      - primavera-network

  # Sentry Worker - Background task processor
  sentry-worker:
    image: getsentry/sentry:24.1.0
    platform: linux/amd64
    container_name: sentry-worker-primavera
    restart: unless-stopped
    depends_on:
      sentry-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sentry run worker
    environment:
      SENTRY_SECRET_KEY: "primavera-sentry-secret-key-change-in-production"
      SENTRY_POSTGRES_HOST: sentry-postgres
      SENTRY_POSTGRES_PORT: 5432
      SENTRY_DB_NAME: sentry
      SENTRY_DB_USER: sentry
      SENTRY_DB_PASSWORD: sentrypassword
      SENTRY_REDIS_HOST: redis
      SENTRY_REDIS_PORT: 6379
    networks:
      - primavera-network

volumes:
  mariadb_data:
    driver: local
  vault_data:
    driver: local
  vault_tokens:
    driver: local
  redis_data:
    driver: local
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  zookeeper_data:
    driver: local
  zookeeper_logs:
    driver: local
  kafka_data:
    driver: local
  elasticsearch_data:
    driver: local
  sentry_postgres_data:
    driver: local
  sentry_data:
    driver: local

networks:
  primavera-network:
    driver: bridge