# ==============================================================================
# Primavera MyBatis + 보안 인프라 - Chapter 10-12
# MyBatis, OAuth2, Spring Security, Redis 캐싱, 게시판 시스템
# ==============================================================================

services:
  # MariaDB - MyBatis용 데이터베이스
  mariadb:
    image: mariadb:11.4.7
    container_name: mariadb-primavera-mybatis
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: primavera
      MARIADB_USER: primavera
      MARIADB_PASSWORD: primavera
      MARIADB_AUTO_UPGRADE: 1
      TZ: UTC
    ports:
      - "3308:3306"
    volumes:
      - mariadb_mybatis_data:/var/lib/mysql
      - ./sql/init-mybatis.sql:/docker-entrypoint-initdb.d/init-mybatis.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-time-zone='+00:00'
    networks:
      - primavera-mybatis
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  # HashiCorp Vault - 설정 관리 및 시크릿 저장
  vault:
    image: hashicorp/vault:1.15
    container_name: vault-primavera-mybatis
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: primavera-dev-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_LOG_LEVEL: info
      VAULT_ADDR: http://127.0.0.1:8200
    ports:
      - "8200:8200"
    volumes:
      - vault_mybatis_data:/vault/data
      - vault_mybatis_tokens:/vault/tokens
      - ./vault:/vault/config
    networks:
      - primavera-mybatis
    healthcheck:
      test: ["CMD", "sh", "-c", "VAULT_ADDR=http://127.0.0.1:8200 vault status"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis - OAuth2 토큰 캐싱 및 세션 저장소 (chap10+)
  redis:
    image: redis:7-alpine
    container_name: redis-primavera-mybatis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_mybatis_data:/data
    networks:
      - primavera-mybatis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Vault 초기화 서비스
  vault-init:
    image: hashicorp/vault:1.15
    container_name: vault-init-primavera-mybatis
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: primavera-dev-token
    volumes:
      - vault_mybatis_tokens:/vault/tokens
      - ./vault:/vault/config
      - ./vault-init.sh:/vault-init.sh
    networks:
      - primavera-mybatis
    command: |
      sh -c "
        echo 'Waiting for Vault to be ready...'
        sleep 10
        apk add --no-cache curl jq
        sh /vault-init.sh
      "
    restart: "no"

volumes:
  mariadb_mybatis_data:
    driver: local
  vault_mybatis_data:
    driver: local
  vault_mybatis_tokens:
    driver: local
  redis_mybatis_data:
    driver: local

networks:
  primavera-mybatis:
    driver: bridge
    name: primavera-mybatis