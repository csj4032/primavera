# ==============================================================================
# Primavera 고급 게시판 + 보안 인프라 - Chapter 13
# 고급 인증/인가, MongoDB, Vault 보안 설정 관리
# ==============================================================================

services:
  # MariaDB - 게시판용 데이터베이스
  mariadb:
    image: mariadb:11.4.7
    container_name: mariadb-primavera-board
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: primavera
      MARIADB_USER: primavera
      MARIADB_PASSWORD: primavera
      MARIADB_AUTO_UPGRADE: 1
      TZ: UTC
    ports:
      - "3308:3306"
    volumes:
      - mariadb_board_data:/var/lib/mysql
      - ./sql/init-board.sql:/docker-entrypoint-initdb.d/init-board.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-time-zone='+00:00'
    networks:
      - primavera-board
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  # HashiCorp Vault - 중앙집중식 설정 관리
  vault:
    image: hashicorp/vault:1.15
    container_name: vault-primavera-board
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: primavera-dev-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_LOG_LEVEL: info
      VAULT_ADDR: http://127.0.0.1:8200
    ports:
      - "8200:8200"
    volumes:
      - vault_board_data:/vault/data
      - vault_board_tokens:/vault/tokens
      - ./vault:/vault/config
    networks:
      - primavera-board
    healthcheck:
      test: ["CMD", "sh", "-c", "VAULT_ADDR=http://127.0.0.1:8200 vault status"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB - 문서 지향 데이터베이스 (chap13)
  mongodb:
    image: mongo:7
    container_name: mongodb-primavera-board
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: primavera
      MONGO_INITDB_DATABASE: primavera
    ports:
      - "27017:27017"
    volumes:
      - mongodb_board_data:/data/db
      - mongodb_board_config:/data/configdb
    networks:
      - primavera-board
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Vault 초기화 서비스
  vault-init:
    image: hashicorp/vault:1.15
    container_name: vault-init-primavera-board
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: primavera-dev-token
    volumes:
      - vault_board_tokens:/vault/tokens
      - ./vault:/vault/config
      - ./vault-init.sh:/vault-init.sh
    networks:
      - primavera-board
    command: |
      sh -c "
        echo 'Waiting for Vault to be ready...'
        sleep 10
        apk add --no-cache curl jq
        sh /vault-init.sh
      "
    restart: "no"

volumes:
  mariadb_board_data:
    driver: local
  vault_board_data:
    driver: local
  vault_board_tokens:
    driver: local
  mongodb_board_data:
    driver: local
  mongodb_board_config:
    driver: local

networks:
  primavera-board:
    driver: bridge
    name: primavera-board