# ==============================================================================
# Primavera JPA + 고급 기능 인프라 - Chapter 14-16
# JPA 고급 매핑, MongoDB, Redis 캐싱, 파일 처리, 모니터링
# ⚠️ chap17은 별도 환경 필요 (Elasticsearch 추가)
# ==============================================================================

services:
  # MariaDB - JPA용 데이터베이스
  mariadb:
    image: mariadb:11.4.7
    container_name: mariadb-primavera-jpa
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: primavera
      MARIADB_USER: primavera
      MARIADB_PASSWORD: primavera
      MARIADB_AUTO_UPGRADE: 1
      TZ: UTC
    ports:
      - "3308:3306"
    volumes:
      - mariadb_jpa_data:/var/lib/mysql
      - ./sql/init-jpa.sql:/docker-entrypoint-initdb.d/init-jpa.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-time-zone='+00:00'
    networks:
      - primavera-jpa
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis - 캐싱 및 세션 저장소
  redis:
    image: redis:7-alpine
    container_name: redis-primavera-jpa
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_jpa_data:/data
    networks:
      - primavera-jpa
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB - 문서 지향 데이터베이스 (chap14)
  mongodb:
    image: mongo:7
    container_name: mongodb-primavera-jpa
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: primavera
      MONGO_INITDB_DATABASE: primavera_jpa_advanced
    ports:
      - "27017:27017"
    volumes:
      - mongodb_jpa_data:/data/db
      - mongodb_jpa_config:/data/configdb
    networks:
      - primavera-jpa
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # HashiCorp Vault - 설정 관리 (chap15-16)
  vault:
    image: hashicorp/vault:1.15
    container_name: vault-primavera-jpa
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: primavera-dev-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_LOG_LEVEL: info
      VAULT_ADDR: http://127.0.0.1:8200
    ports:
      - "8200:8200"
    volumes:
      - vault_jpa_data:/vault/data
      - vault_jpa_tokens:/vault/tokens
      - ./vault:/vault/config
    networks:
      - primavera-jpa
    healthcheck:
      test: ["CMD", "sh", "-c", "VAULT_ADDR=http://127.0.0.1:8200 vault status"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Vault 초기화 서비스
  vault-init:
    image: hashicorp/vault:1.15
    container_name: vault-init-primavera-jpa
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: primavera-dev-token
    volumes:
      - vault_jpa_tokens:/vault/tokens
      - ./vault:/vault/config
      - ./vault-init.sh:/vault-init.sh
    networks:
      - primavera-jpa
    command: |
      sh -c "
        echo 'Waiting for Vault to be ready...'
        sleep 10
        apk add --no-cache curl jq
        sh /vault-init.sh
      "
    restart: "no"

  # Elasticsearch - 데이터 파이프라인 (chap17 전용)
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: elasticsearch-primavera-jpa
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"  # JPA 환경에서는 메모리 사용량 감소
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_jpa_data:/usr/share/elasticsearch/data
    networks:
      - primavera-jpa
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mariadb_jpa_data:
    driver: local
  redis_jpa_data:
    driver: local
  mongodb_jpa_data:
    driver: local
  mongodb_jpa_config:
    driver: local
  vault_jpa_data:
    driver: local
  vault_jpa_tokens:
    driver: local
  elasticsearch_jpa_data:
    driver: local

networks:
  primavera-jpa:
    driver: bridge
    name: primavera-jpa