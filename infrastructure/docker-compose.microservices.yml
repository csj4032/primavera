# ==============================================================================
# Primavera 마이크로서비스 전체 인프라 - Chapter 18
# 완전한 마이크로서비스 아키텍처: 모든 서비스 + 이벤트 스트리밍
# ==============================================================================

services:
  # MariaDB - 마이크로서비스용 데이터베이스
  mariadb:
    image: mariadb:11.4.7
    container_name: mariadb-primavera-microservices
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: primavera
      MARIADB_USER: primavera
      MARIADB_PASSWORD: primavera
      MARIADB_AUTO_UPGRADE: 1
      TZ: UTC
    ports:
      - "3308:3306"
    volumes:
      - mariadb_microservices_data:/var/lib/mysql
      - ./sql/init-unified-local.sql:/docker-entrypoint-initdb.d/init-local.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-time-zone='+00:00'
    networks:
      - primavera-microservices
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis - 세션 저장소 및 캐싱
  redis:
    image: redis:7-alpine
    container_name: redis-primavera-microservices
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_microservices_data:/data
    networks:
      - primavera-microservices
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB - 상품 서비스용 문서 데이터베이스
  mongodb:
    image: mongo:7
    container_name: mongodb-primavera-microservices
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: primavera
      MONGO_INITDB_DATABASE: primavera_products
    ports:
      - "27017:27017"
    volumes:
      - mongodb_microservices_data:/data/db
      - mongodb_microservices_config:/data/configdb
    networks:
      - primavera-microservices
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Zookeeper - Kafka 의존성
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper-primavera-microservices
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SYNC_LIMIT: 2
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_microservices_data:/var/lib/zookeeper/data
      - zookeeper_microservices_logs:/var/lib/zookeeper/log
    networks:
      - primavera-microservices
    healthcheck:
      test: ["CMD", "bash", "-c", "echo 'ruok' | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka - 이벤트 스트리밍 플랫폼
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka-primavera-microservices
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    volumes:
      - kafka_microservices_data:/var/lib/kafka/data
    networks:
      - primavera-microservices
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5

  # Elasticsearch - 상품 검색 및 로그 수집
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: elasticsearch-primavera-microservices
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_microservices_data:/usr/share/elasticsearch/data
    networks:
      - primavera-microservices
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # HashiCorp Vault - 마이크로서비스 설정 관리
  vault:
    image: hashicorp/vault:1.15
    container_name: vault-primavera-microservices
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: primavera-dev-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_LOG_LEVEL: info
      VAULT_ADDR: http://127.0.0.1:8200
    ports:
      - "8200:8200"
    volumes:
      - vault_microservices_data:/vault/data
      - vault_microservices_tokens:/vault/tokens
      - ./vault:/vault/config
    networks:
      - primavera-microservices
    healthcheck:
      test: ["CMD", "sh", "-c", "VAULT_ADDR=http://127.0.0.1:8200 vault status"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Vault 초기화 서비스
  vault-init:
    image: hashicorp/vault:1.15
    container_name: vault-init-primavera-microservices
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: primavera-dev-token
    volumes:
      - vault_microservices_tokens:/vault/tokens
      - ./vault:/vault/config
      - ./vault-init.sh:/vault-init.sh
    networks:
      - primavera-microservices
    command: |
      sh -c "
        echo 'Waiting for Vault to be ready...'
        sleep 10
        apk add --no-cache curl jq
        sh /vault-init.sh
      "
    restart: "no"

volumes:
  mariadb_microservices_data:
    driver: local
  redis_microservices_data:
    driver: local
  mongodb_microservices_data:
    driver: local
  mongodb_microservices_config:
    driver: local
  zookeeper_microservices_data:
    driver: local
  zookeeper_microservices_logs:
    driver: local
  kafka_microservices_data:
    driver: local
  elasticsearch_microservices_data:
    driver: local
  vault_microservices_data:
    driver: local
  vault_microservices_tokens:
    driver: local

networks:
  primavera-microservices:
    driver: bridge
    name: primavera-microservices