# ==============================================================================
# Primavera 기본 환경 - Chapter 04-09: MariaDB + Vault
# Spring Boot 기초, 데이터 접근, 보안 기초
# ⚠️ chap01-03은 Docker 불필요 (H2 메모리 DB 사용)
# ==============================================================================

services:
  # MariaDB - 기본 데이터베이스
  mariadb:
    image: mariadb:11.4.7
    container_name: mariadb-primavera-basic
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: primavera
      MARIADB_USER: primavera
      MARIADB_PASSWORD: primavera
      MARIADB_AUTO_UPGRADE: 1
      TZ: UTC
    ports:
      - "3308:3306"
    volumes:
      - mariadb_basic_data:/var/lib/mysql
      - ./sql/init-basic.sql:/docker-entrypoint-initdb.d/init-basic.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-time-zone='+00:00'
    networks:
      - primavera-basic
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  # HashiCorp Vault - 설정 관리 및 시크릿 저장 (chap04+)
  vault:
    image: hashicorp/vault:1.15
    container_name: vault-primavera-basic
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: primavera-dev-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_LOG_LEVEL: info
      VAULT_ADDR: http://127.0.0.1:8200
    ports:
      - "8200:8200"
    volumes:
      - vault_basic_data:/vault/data
      - vault_basic_tokens:/vault/tokens
      - ./vault:/vault/config
    networks:
      - primavera-basic
    healthcheck:
      test: ["CMD", "sh", "-c", "VAULT_ADDR=http://127.0.0.1:8200 vault status"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Vault 초기화 서비스
  vault-init:
    image: hashicorp/vault:1.15
    container_name: vault-init-primavera-basic
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: primavera-dev-token
    volumes:
      - vault_basic_tokens:/vault/tokens
      - ./vault:/vault/config
      - ./vault-init.sh:/vault-init.sh
    networks:
      - primavera-basic
    command: |
      sh -c "
        echo 'Waiting for Vault to be ready...'
        sleep 10
        apk add --no-cache curl jq
        sh /vault-init.sh
      "
    restart: "no"

volumes:
  mariadb_basic_data:
    driver: local
  vault_basic_data:
    driver: local
  vault_basic_tokens:
    driver: local

networks:
  primavera-basic:
    driver: bridge
    name: primavera-basic