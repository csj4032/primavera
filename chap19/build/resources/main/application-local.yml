spring:
  # Use infrastructure services for local development
  datasource:
    url: jdbc:mariadb://localhost:3320/primavera_performance
    username: primavera
    password: primavera
    
  data:
    redis:
      host: localhost
      port: 6380  # chap19 dedicated Redis port
      
  jpa:
    hibernate:
      ddl-auto: validate  # Use pre-created schema from init.sql
    show-sql: true
    
  # Vault configuration for local development
  cloud:
    vault:
      enabled: true
      host: localhost
      port: 8201
      token: primavera-vault-token-chap19
    
logging:
  level:
    com.genius.primavera: DEBUG
    org.springframework.cache: TRACE
    io.micrometer: DEBUG
    org.springframework.cloud.vault: DEBUG
    
# Local development performance settings
performance:
  monitoring:
    enabled: true
    interval: 5s  # More frequent monitoring for development
  cache:
    warmup:
      enabled: false  # Disable for faster startup in development
  optimization:
    query:
      slow-query-threshold: 50ms  # Lower threshold for development