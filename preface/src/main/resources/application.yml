app:
  name: Primavera 경량 프레임워크
  version: 1.0.0
  description: Spring Boot 동작 원리를 이해하기 위한 경량 프레임워크 데모
  welcome:
    message: 🌸 Primavera 경량 프레임워크에 오신 것을 환영합니다!
  startup:
    greeting: 안녕하세요! Primavera 프레임워크입니다.

logging:
  level:
    com.genius.primavera.lightweight: DEBUG
    root: INFO

system:
  max:
    threads: 10
  timeout:
    seconds: 30

developer:
  name: Primavera 개발팀
  email: team@primavera.com

test:
  korean:
    message: 한글 인코딩 테스트 메시지입니다
  emoji:
    message: 🌸🌺🌻 이모지와 한글이 함께 표시됩니다 🎉🎊