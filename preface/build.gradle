
plugins {
    id 'org.springframework.boot' version "${springBootVersion}"
    id 'io.spring.dependency-management' version "${springDependencyManagementVersion}"
}

dependencies {
    // Implementation dependencies (alphabetical)
    implementation 'org.projectlombok:lombok'
    implementation 'org.springframework.boot:spring-boot-devtools'
    implementation 'org.springframework.boot:spring-boot-starter'
    
    // Annotation processors
    annotationProcessor 'org.projectlombok:lombok'
    
    // Test implementation dependencies (alphabetical)
    testImplementation('org.springframework.boot:spring-boot-starter-test') {
        exclude module: 'junit'
    }
}

task runLightweightDemo(type: JavaExec) {
    group = 'application'
    description = 'Primavera 경량 프레임워크 데모 애플리케이션을 실행합니다'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.genius.primavera.lightweight.example.PrimaveraLightweightDemo'
    
    // JVM options
    jvmArgs = [
        '-Dspring.profiles.active=local',
        '-Dlogging.level.com.genius.primavera.lightweight=DEBUG'
    ]
    
    // Console input support
    standardInput = System.in
}