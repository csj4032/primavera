plugins {
    id 'org.springframework.boot' version "${springBootVersion}"
    id 'io.spring.dependency-management' version "${springDependencyManagementVersion}"
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

dependencies {
    // Netflix Hystrix는 Spring Boot 3.x에서 deprecated되었으므로 제거하고 대안 사용
    // implementation('org.springframework.cloud:spring-cloud-starter-netflix-hystrix')
    // implementation('org.springframework.cloud:spring-cloud-starter-netflix-hystrix-dashboard')
    implementation('org.springframework.cloud:spring-cloud-starter-openfeign')
    // Ribbon도 deprecated되었으므로 Spring Cloud LoadBalancer 사용
    // implementation('org.springframework.cloud:spring-cloud-starter-netflix-ribbon')
    implementation('org.springframework.cloud:spring-cloud-starter-loadbalancer')
    // Turbine도 deprecated
    // implementation('org.springframework.cloud:spring-cloud-starter-turbine:1.4.7.RELEASE')
    implementation('org.springframework.boot:spring-boot-starter-web') {
        exclude module: "spring-boot-starter-tomcat"
    }
    implementation('org.springframework.boot:spring-boot-starter-aop')
    implementation('org.springframework.boot:spring-boot-starter-cache')
    implementation('org.springframework.boot:spring-boot-devtools')
    implementation('org.springframework.boot:spring-boot-starter-undertow')
    implementation("com.navercorp.lucy:lucy-xss-servlet:${lucyXssServletVersion}")
    implementation("org.modelmapper:modelmapper:${modelMapperVersion}")
    implementation('org.projectlombok:lombok')
    implementation("com.squareup.okhttp3:okhttp:${okhttpVersion}")
    implementation("io.github.openfeign:feign-jackson:${feignVersion}")
    implementation("io.github.openfeign:feign-gson:${feignVersion}")
    implementation("io.github.openfeign:feign-okhttp:${feignVersion}")
    implementation("org.ehcache:ehcache:${ehcacheVersion}")
    annotationProcessor('org.projectlombok:lombok')
    testImplementation('org.springframework.boot:spring-boot-starter-test') {
        exclude module: 'junit'
    }
}