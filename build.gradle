plugins {
    id 'java'
    id 'jacoco'
    id 'com.github.kt3k.coveralls' version '2.12.0'
    id 'org.springframework.boot' version "${springBootVersion}" apply false
    id 'io.spring.dependency-management' version "${springDependencyManagementVersion}" apply false
}

task jacocoRootReport(type: JacocoReport) {
    description = 'Generates an aggregate report from all subprojects'
    group = 'reporting'

    // 모든 서브프로젝트의 jacocoTestReport에 의존 (실패하는 모듈 제외)
    dependsOn {
        subprojects.findAll {
            it.plugins.hasPlugin('jacoco') &&
                    it.name == 'chap01' // 현재는 chap01만 포함
        }.collect {
            it.tasks.jacocoTestReport
        }
    }

    subprojects.each { subproject ->
        if (subproject.plugins.hasPlugin('java') && subproject.name == 'chap01') {
            additionalSourceDirs.from(subproject.sourceSets.main.allSource.srcDirs)
            sourceDirectories.from(subproject.sourceSets.main.allSource.srcDirs)
            classDirectories.from(subproject.sourceSets.main.output)
        }
    }

    executionData.from(fileTree(dir: '.', includes: ['**/build/jacoco/test.exec']))

    reports {
        xml.required = true
        csv.required = false
        html.required = true
        xml.outputLocation = file("${buildDir}/reports/jacoco/test/jacocoTestReport.xml")
        html.outputLocation = file("${buildDir}/reports/jacoco/test/html")
    }
}

coveralls {
    sourceDirs = allprojects.sourceSets.main.allSource.srcDirs.flatten()
    jacocoReportPath = "${buildDir}/reports/jacoco/test/jacocoTestReport.xml"
}

allprojects {
    repositories {
        mavenCentral()
    }
}

subprojects {

    group = 'com.genius.primavera'
    version = '0.0.1-SNAPSHOT'

    apply plugin: 'java'
    apply plugin: 'jacoco'
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'

    repositories {
        mavenCentral()
    }

    dependencyManagement {
        imports {
            mavenBom "org.springframework.cloud:spring-cloud-dependencies:2023.0.4"
        }
    }

    dependencies {
        implementation "org.springframework.boot:spring-boot-starter-web"
        implementation "org.slf4j:slf4j-api:${slf4jVersion}"
        compileOnly "org.projectlombok:lombok:${lombokVersion}"
        annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
        compileOnly "org.jetbrains:annotations:${jetbrainsAnnotationsVersion}"
        testImplementation "org.springframework.boot:spring-boot-starter-test"
        testCompileOnly "org.projectlombok:lombok:${lombokVersion}"
        testAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"
        compileOnly "jakarta.validation:jakarta.validation-api:${javaxValidationVersion}"
    }

}

ext {
    databaseDependencies = [
            "org.springframework.boot:spring-boot-starter-jdbc",
            "org.mariadb.jdbc:mariadb-java-client:${mariadbVersion}"
    ]
    aopDependencies = [
            "org.springframework.boot:spring-boot-starter-aop"
    ]

    mybatisDependencies = [
            "org.mybatis.spring.boot:mybatis-spring-boot-starter:${mybatisSpringBootStarterVersion}",
            "org.mybatis.dynamic-sql:mybatis-dynamic-sql:${mybatisDynamicSqlVersion}"
    ]

    thymeleafDependencies = [
            "org.springframework.boot:spring-boot-starter-thymeleaf",
            "nz.net.ultraq.thymeleaf:thymeleaf-layout-dialect:${thymeleafLayoutDialectVersion}"
    ]

    securityDependencies = [
            "org.springframework.security:spring-security-config:${springSecurityVersion}",
            "org.springframework.security:spring-security-core:${springSecurityVersion}",
            "org.springframework.security:spring-security-crypto:${springSecurityVersion}",
            "org.springframework.security:spring-security-web:${springSecurityVersion}"
    ]

    testContainersDependencies = [
            "org.testcontainers:junit-jupiter:${testContainersVersion}",
            "org.testcontainers:mariadb:${testContainersVersion}",
            "org.testcontainers:kafka:${testContainersVersion}",
            "org.testcontainers:elasticsearch:${testContainersVersion}",
            "org.testcontainers:postgresql:${testContainersVersion}",
            "org.testcontainers:mongodb:${testContainersVersion}",
    ]

    validationDependencies = [
            "org.springframework.boot:spring-boot-starter-validation",
            "jakarta.validation:jakarta.validation-api:${javaxValidationVersion}"
    ]

    developmentDependencies = [
            "org.springframework.boot:spring-boot-devtools"
    ]

    loggingDependencies = [
            "com.github.gavlyukovskiy:p6spy-spring-boot-starter:${p6spySpringBootStarterVersion}",
            "org.bgee.log4jdbc-log4j2:log4jdbc-log4j2-jdbc4.1:${log4jdbcLog4j2Version}"
    ]

    webUiDependencies = [
            "org.webjars:bootstrap:${bootstrapVersion}",
            "org.graalvm.js:js:${graalvmJsVersion}",
            "org.graalvm.js:js-scriptengine:${graalvmJsVersion}"
    ]
}

subprojects {
    test {
        useJUnitPlatform()
        finalizedBy jacocoTestReport
    }

    jacocoTestReport {
        dependsOn test
        reports {
            xml.required = true
            csv.required = false
            html.required = true
        }
    }
}
